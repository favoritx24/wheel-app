<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>КЭШ-МАГНАТ | BOXES VIP</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #030712;
            --gold-gradient: linear-gradient(135deg, #FFE259 0%, #FFA751 100%);
            --blue-box-grad: radial-gradient(circle at 50% 25%, #2563eb 0%, #1d4ed8 45%, #0f172a 100%);
            --red-ribbon-grad: linear-gradient(135deg, #ff2a5f 0%, #dc2626 50%, #991b1b 100%);
            --neon-gold: #FFE259;
            --neon-blue: #38bdf8;
            --text-main: #FFFFFF;
            --text-muted: #94A3B8;
            --border-glass: rgba(56, 189, 248, 0.3);
            --border-subtle: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
            position: relative;
            background-size: cover;
            background-position: center;
        }

        .ambient-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.45;
            animation: orbFloat 12s infinite alternate ease-in-out;
        }

        .orb-1 {
            width: 280px; height: 280px;
            background: #1d4ed8;
            top: -50px; left: -50px;
        }

        .orb-2 {
            width: 320px; height: 320px;
            background: #e11d48;
            bottom: -70px; right: -70px;
            animation-delay: -5s;
        }

        @keyframes orbFloat {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(35px, 45px) scale(1.15); }
        }

        .app-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 420px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 12px 18px 18px 18px;
        }

        .header-block {
            text-align: center;
            width: 100%;
        }

        .brand-logo-svg {
            max-width: 260px;
            height: auto;
            filter: drop-shadow(0 4px 20px rgba(255, 226, 89, 0.4));
            margin-bottom: 2px;
        }

        .brand-logo-img {
            max-height: 48px;
            max-width: 240px;
            object-fit: contain;
            filter: drop-shadow(0 4px 15px rgba(56, 189, 248, 0.4));
            margin-bottom: 6px;
        }

        .attempts-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid var(--border-subtle);
            padding: 5px 16px;
            border-radius: 30px;
            backdrop-filter: blur(15px);
            margin-top: 2px;
        }

        .attempts-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .attempts-count {
            font-size: 15px;
            font-weight: 900;
            color: var(--neon-gold);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .live-prizes-bar {
            width: 100%;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            padding: 8px 14px;
            margin-top: 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(15px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
        }

        .live-prize-tag {
            font-size: 11px;
            font-weight: 800;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .live-prize-val {
            font-size: 12px;
            font-weight: 800;
            color: #2ECC71;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .game-stage {
            position: relative;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
        }

        .boxes-wrapper {
            display: block;
            width: 100%;
            max-width: 360px;
            padding: 4px 0;
            z-index: 5;
        }

        .boxes-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            width: 100%;
        }

        .prize-box {
            position: relative;
            aspect-ratio: 1;
            background: var(--blue-box-grad);
            border: 2px solid rgba(56, 189, 248, 0.55);
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: visible;
            backdrop-filter: blur(12px);
            box-shadow: 0 14px 30px rgba(0, 0, 0, 0.8), inset 0 2px 4px rgba(255, 255, 255, 0.4);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .box-pattern-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 20px;
            background-image: repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.04) 0, rgba(255, 255, 255, 0.04) 10px, transparent 0, transparent 20px);
            z-index: 1;
            pointer-events: none;
        }

        .prize-box:hover {
            transform: translateY(-4px) scale(1.03);
            border-color: var(--neon-blue);
            box-shadow: 0 18px 38px rgba(56, 189, 248, 0.45);
        }

        .prize-box:active {
            transform: scale(0.93);
        }

        .box-ribbon-v {
            position: absolute;
            top: 0; left: 50%;
            transform: translateX(-50%);
            width: 20px; height: 100%;
            background: var(--red-ribbon-grad);
            box-shadow: 0 0 10px rgba(220, 38, 38, 0.8);
            z-index: 2;
            border-radius: 2px;
            transition: opacity 0.5s ease-out, transform 0.5s ease-out;
        }

        .box-ribbon-h {
            position: absolute;
            top: 50%; left: 0;
            transform: translateY(-50%);
            width: 100%; height: 20px;
            background: var(--red-ribbon-grad);
            box-shadow: 0 0 10px rgba(220, 38, 38, 0.8);
            z-index: 2;
            border-radius: 2px;
            transition: opacity 0.5s ease-out, transform 0.5s ease-out;
        }

        .box-bow {
            position: absolute;
            top: -24px;
            z-index: 4;
            width: 82px; height: 60px;
            filter: drop-shadow(0 8px 15px rgba(0, 0, 0, 0.75));
            transition: opacity 0.5s ease-out, transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
        }

        .box-cover-lid {
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            border-radius: 22px;
            z-index: 3;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--blue-box-grad);
            border: 2px solid rgba(255, 255, 255, 0.3);
            transition: all 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .prize-box.shaking {
            animation: boxShake 2.5s infinite cubic-bezier(.36,.07,.19,.97) both;
            border-color: var(--neon-gold);
            box-shadow: 0 0 35px rgba(255, 226, 89, 0.85);
        }

        @keyframes boxShake {
            10%, 90% { transform: translate3d(-3px, 0, 0) rotate(-4deg); }
            20%, 80% { transform: translate3d(4px, 0, 0) rotate(5deg); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0) rotate(-8deg); }
            40%, 60% { transform: translate3d(6px, 0, 0) rotate(8deg); }
        }

        .prize-box.opening .box-cover-lid {
            transform: translateY(-90px) rotateX(-50deg) scale(0.5);
            opacity: 0;
        }

        .prize-box.opening .box-bow,
        .prize-box.opened .box-bow {
            transform: translateY(-120px) scale(0.2) rotate(25deg);
            opacity: 0 !important;
        }

        .prize-box.opening .box-ribbon-v,
        .prize-box.opening .box-ribbon-h,
        .prize-box.opened .box-ribbon-v,
        .prize-box.opened .box-ribbon-h {
            opacity: 0 !important;
        }

        .box-content {
            position: absolute;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px;
            z-index: 25;
            opacity: 0;
            transform: scale(0.2) translateY(20px);
            transition: all 1.0s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: transparent;
        }

        .prize-box.opened .box-content, .prize-box.opening .box-content {
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        .prize-box.opened {
            border-color: rgba(255, 226, 89, 0.9);
            box-shadow: 0 0 30px rgba(255, 226, 89, 0.4), inset 0 0 15px rgba(255, 226, 89, 0.25);
            background: rgba(255, 226, 89, 0.08);
        }

        .box-content img {
            max-width: 80%;
            max-height: 80%;
            object-fit: contain;
            background: transparent;
            mix-blend-mode: normal;
            filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.6));
        }

        .box-content svg {
            width: 44px;
            height: 44px;
            object-fit: contain;
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.5));
        }

        .box-content span {
            font-size: 10px;
            font-weight: 800;
            color: #FFFFFF;
            text-align: center;
            margin-top: 4px;
            line-height: 1.1;
        }

        .trust-banner {
            width: 100%;
            max-width: 360px;
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(46, 204, 113, 0.25);
            border-radius: 16px;
            padding: 8px 12px;
            margin-top: 10px;
            backdrop-filter: blur(12px);
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .trust-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 10px;
            font-weight: 900;
            color: #2ECC71;
            letter-spacing: 0.6px;
            margin-bottom: 3px;
            text-transform: uppercase;
        }

        .trust-text {
            font-size: 10px;
            color: #94A3B8;
            line-height: 1.35;
            font-weight: 500;
        }

        .trust-text b {
            color: #FFFFFF;
            font-weight: 800;
        }

        .wheel-wrapper {
            display: none;
            position: relative;
            width: 310px; height: 310px;
            justify-content: center; align-items: center;
        }
        .wheel-halo {
            position: absolute; width: 324px; height: 324px; border-radius: 50%;
            border: 3px solid var(--neon-gold); box-shadow: 0 0 35px rgba(255, 226, 89, 0.35); z-index: 3; pointer-events: none;
        }
        .pointer-marker { position: absolute; top: -14px; left: 50%; transform: translateX(-50%); width: 30px; height: 36px; z-index: 10; }
        #wheelCanvas { width: 310px; height: 310px; border-radius: 50%; transition: transform 4.6s cubic-bezier(0.12, 0.8, 0.15, 1); }

        .ribbon-wrapper {
            display: none; position: relative; width: 100%; height: 130px; background: rgba(15, 23, 42, 0.75);
            border: 2px solid var(--border-glass); border-radius: 24px; overflow: hidden; backdrop-filter: blur(20px);
        }
        .ribbon-pointer-line { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 4px; height: 100%; background: var(--gold-gradient); z-index: 10; }
        .ribbon-track { display: flex; align-items: center; height: 100%; position: absolute; left: 0; transition: transform 4.6s cubic-bezier(0.12, 0.8, 0.15, 1); }
        .ribbon-card { width: 100px; height: 100px; margin: 0 6px; background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border-subtle); border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; flex-shrink: 0; }
        .ribbon-card img, .ribbon-card svg { width: 34px; height: 34px; object-fit: contain; }
        .ribbon-card span { font-size: 10px; font-weight: 700; color: #FFF; text-align: center; }

        .btn-glow {
            width: 100%;
            padding: 18px 0;
            border: none;
            border-radius: 50px;
            background: var(--gold-gradient);
            color: #050713;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 16px;
            font-weight: 900;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(255, 167, 81, 0.4);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            z-index: 5;
        }

        .btn-glow:active { transform: scale(0.96); }
        .btn-glow:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(4, 6, 14, 0.94);
            backdrop-filter: blur(16px);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .modal-card {
            background: linear-gradient(160deg, #0f172a 0%, #030712 100%);
            border: 1px solid var(--border-glass);
            border-radius: 28px;
            padding: 28px 22px;
            width: 100%;
            max-width: 330px;
            text-align: center;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.9), 0 0 40px rgba(56, 189, 248, 0.2);
            transform: scale(0.8);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .modal-overlay.active .modal-card {
            transform: scale(1);
        }

        .modal-icon-badge {
            width: 84px; height: 84px;
            margin: 0 auto 16px auto;
            background: rgba(255, 226, 89, 0.08);
            border-radius: 26px;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid rgba(255, 226, 89, 0.3);
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }

        .modal-icon-badge svg, .modal-icon-badge img {
            width: 46px; height: 46px;
            object-fit: contain;
        }

        .modal-title {
            font-size: 20px; font-weight: 900;
            color: var(--neon-gold);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .modal-desc {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 18px;
            line-height: 1.5;
        }

        .prize-summary-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 12px 16px;
            margin-bottom: 18px;
        }

        .prize-summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .prize-summary-row:last-child { border-bottom: none; }
        .prize-label { color: var(--text-muted); }
        .prize-val { font-weight: 800; color: #FFFFFF; }

        .modal-action-btn {
            width: 100%;
            padding: 16px 0;
            border: none;
            border-radius: 50px;
            background: var(--gold-gradient);
            color: #050713;
            font-weight: 900;
            font-size: 15px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 8px 25px rgba(255, 167, 81, 0.3);
            transition: all 0.2s ease;
        }

        .modal-action-btn:active { transform: scale(0.96); }

        .security-note {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 14px;
        }
    </style>
</head>
<body>

    <div class="ambient-canvas">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <div class="app-container">
        <!-- Шапка -->
        <div class="header-block">
            <div id="logoContainer">
                <svg class="brand-logo-svg" viewBox="0 0 320 60" fill="none">
                    <rect x="10" y="5" width="300" height="50" rx="25" fill="url(#bgL)" stroke="url(#brL)" stroke-width="1.5"/>
                    <path d="M35 20 L40 38 L45 28 L50 38 L55 20" stroke="#FFE259" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="45" cy="16" r="3" fill="#FFA751"/>
                    <text x="70" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="21" fill="url(#txtG)" letter-spacing="2">КЭШ-МАГНАТ</text>
                    <path d="M280 22 L285 30 L293 31 L287 37 L289 45 L281 41 L273 45 L275 37 L269 31 L277 30 Z" fill="#FFE259"/>
                    <defs>
                        <linearGradient id="bgL" x1="0" y1="0" x2="320" y2="60">
                            <stop stop-color="#0f172a" stop-opacity="0.9"/>
                            <stop offset="1" stop-color="#1e293b" stop-opacity="0.9"/>
                        </linearGradient>
                        <linearGradient id="brL" x1="0" y1="0" x2="320" y2="60">
                            <stop stop-color="#FFE259" stop-opacity="0.6"/>
                            <stop offset="1" stop-color="#FFA751" stop-opacity="0.2"/>
                        </linearGradient>
                        <linearGradient id="txtG" x1="70" y1="0" x2="250" y2="0" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#FFE259"/>
                            <stop offset="1" stop-color="#FFA751"/>
                        </linearGradient>
                    </defs>
                </svg>
            </div>
            
            <div class="attempts-pill">
                <span class="attempts-label">Доступно попыток:</span>
                <span class="attempts-count" id="attCounter">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
                    <span id="attNum">3</span>
                </span>
            </div>

            <div class="live-prizes-bar" id="livePrizesBar">
                <span class="live-prize-tag">Ваш багаж:</span>
                <span class="live-prize-val" id="livePrizesVal">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFE259" stroke-width="2"><path d="M20 12v10H4V12"/><path d="M22 7H2v5h20V7z"/><path d="M12 22V7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>
                    Ожидает открытия...
                </span>
            </div>
        </div>

        <!-- Игровая Сцена -->
        <div class="game-stage">
            <div class="boxes-wrapper" id="boxesBox">
                <div class="boxes-grid" id="boxesGrid"></div>
            </div>

            <div class="wheel-wrapper" id="wheelBox">
                <div class="wheel-halo"></div>
                <svg class="pointer-marker" viewBox="0 0 28 34" fill="none">
                    <path d="M14 34L0 0H28L14 34Z" fill="url(#ptrG)"/>
                    <defs>
                        <linearGradient id="ptrG" x1="14" y1="0" x2="14" y2="34" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#FFE259"/>
                            <stop offset="1" stop-color="#FFA751"/>
                        </linearGradient>
                    </defs>
                </svg>
                <canvas id="wheelCanvas" width="620" height="620"></canvas>
            </div>

            <div class="ribbon-wrapper" id="ribbonBox">
                <div class="ribbon-pointer-line"></div>
                <div class="ribbon-track" id="ribbonTrack"></div>
            </div>

            <div class="trust-banner">
                <div class="trust-header">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#2ECC71" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
                    <span>ОФИЦИАЛЬНЫЙ СЕРТИФИЦИРОВАННЫЙ РОЗЫГРЫШ</span>
                </div>
                <div class="trust-text">
                    При поддержке <b>Т-Банк</b>, <b>Сбер</b>, <b>OZON</b>, <b>WB</b>, <b>DNS</b> и <b>Яндекс Маркет</b>. Все выплаты и доставка призов гарантированы.
                </div>
            </div>
        </div>

        <button class="btn-glow" id="spinBtn" onclick="executeSpin()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
            ИСПЫТАТЬ УДАЧУ
        </button>
    </div>

    <div class="modal-overlay" id="resultModal">
        <div class="modal-card">
            <div class="modal-icon-badge" id="modalIconBox"></div>
            <h2 class="modal-title" id="modalTitle">ВЫИГРЫШ!</h2>
            <div id="modalBody"></div>
            <button class="modal-action-btn" id="modalBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                ПРОДОЛЖИТЬ
            </button>
            <div class="security-note">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                Результаты зашифрованы и сохранены
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const urlParams = new URLSearchParams(window.location.search);
        const userId = tg.initDataUnsafe?.user?.id ? String(tg.initDataUnsafe.user.id) : (urlParams.get('uid') || 'guest');
        
        // Гарантированное получение юзернейма бота
        let botUsername = urlParams.get('b') || '';
        if (!botUsername && tg.initDataUnsafe && tg.initDataUnsafe.bot && tg.initDataUnsafe.bot.username) {
            botUsername = tg.initDataUnsafe.bot.username;
        }

        const urlVersion = urlParams.get('v') || '0';
        const customLogo = urlParams.get('logo');
        const customBg = urlParams.get('bg');

        if (customBg) {
            document.body.style.backgroundImage = `url('${decodeURIComponent(customBg)}')`;
        }

        if (customLogo) {
            document.getElementById('logoContainer').innerHTML = `<img src="${decodeURIComponent(customLogo)}" class="brand-logo-img" alt="Logo">`;
        }

        function saveState(stateObj) {
            stateObj.v = urlVersion;
            const str = JSON.stringify(stateObj);
            try { localStorage.setItem('km_state_' + userId, str); } catch(e){}
            try { if (tg.CloudStorage) tg.CloudStorage.setItem('km_state_' + userId, str); } catch(e){}
        }

        function loadState() {
            try {
                const local = localStorage.getItem('km_state_' + userId);
                if (local) return JSON.parse(local);
            } catch(e){}
            return null;
        }

        function clearState() {
            try {
                for (let key in localStorage) {
                    if (key.startsWith('km_state_')) {
                        localStorage.removeItem(key);
                    }
                }
            } catch(e){}
            try { if (tg.CloudStorage) tg.CloudStorage.removeItem('km_state_' + userId); } catch(e){}
        }

        const rawGameMode = urlParams.get('mode');
        const gameMode = (rawGameMode === 'wheel' || rawGameMode === 'ribbon') ? rawGameMode : 'boxes';

        const SVGS = {
            cross: `<svg viewBox="0 0 24 24" fill="none" stroke="#FF4B4B" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`,
            bonus: `<svg viewBox="0 0 24 24" fill="none" stroke="#2ECC71" stroke-width="2" stroke-linecap="round"><path d="M20 12v10H4V12"/><path d="M22 7H2v5h20V7z"/><path d="M12 22V7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>`,
            cash: `<svg viewBox="0 0 24 24" fill="none" stroke="#2ECC71" stroke-width="2" stroke-linecap="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/><path d="M6 12h.01M18 12h.01"/></svg>`,
            iphone: `<svg viewBox="0 0 24 24" fill="none" stroke="#9B51E0" stroke-width="2" stroke-linecap="round"><rect x="5" y="2" width="14" height="20" rx="3"/><path d="M12 18h.01"/></svg>`,
            watch: `<svg viewBox="0 0 24 24" fill="none" stroke="#F2994A" stroke-width="2" stroke-linecap="round"><rect x="6" y="7" width="12" height="10" rx="3"/><path d="M9 3h6v4H9zM9 17h6v4H9z"/></svg>`,
            laptop: `<svg viewBox="0 0 24 24" fill="none" stroke="#2F80ED" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M2 20h20"/></svg>`,
            trophy: `<svg viewBox="0 0 24 24" fill="none" stroke="#FFE259" stroke-width="2" stroke-linecap="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2z"/></svg>`,
            redBow: `<svg class="box-bow" viewBox="0 0 100 70" fill="none">
                <path d="M35 35 L15 65 L30 60 L45 38 Z" fill="url(#tailG)"/>
                <path d="M65 35 L85 65 L70 60 L55 38 Z" fill="url(#tailG)"/>
                <path d="M50 30 C30 5 5 15 10 32 C15 45 40 35 50 30 Z" fill="url(#bowGrad)"/>
                <path d="M50 30 C70 5 95 15 90 32 C85 45 60 35 50 30 Z" fill="url(#bowGrad)"/>
                <path d="M48 28 C35 12 18 20 22 30 C25 35 42 32 48 28 Z" fill="#ff4b72" opacity="0.6"/>
                <path d="M52 28 C65 12 82 20 78 30 C75 35 58 32 52 28 Z" fill="#ff4b72" opacity="0.6"/>
                <rect x="42" y="22" width="16" height="16" rx="5" fill="url(#knotG)" stroke="#dc2626" stroke-width="1.5"/>
                <defs>
                    <linearGradient id="bowGrad" x1="0" y1="0" x2="100" y2="70">
                        <stop stop-color="#ff3366"/>
                        <stop offset="0.5" stop-color="#dc2626"/>
                        <stop offset="1" stop-color="#881337"/>
                    </linearGradient>
                    <linearGradient id="tailG" x1="0" y1="0" x2="0" y2="70">
                        <stop stop-color="#e11d48"/>
                        <stop offset="1" stop-color="#9f1239"/>
                    </linearGradient>
                    <linearGradient id="knotG" x1="42" y1="22" x2="58" y2="38">
                        <stop stop-color="#fda4af"/>
                        <stop offset="0.5" stop-color="#e11d48"/>
                        <stop offset="1" stop-color="#9f1239"/>
                    </linearGradient>
                </defs>
            </svg>`
        };

        const SECTORS = [
            { id: 0, type: 'loss', name: 'Проигрыш', svgKey: 'cross', color: '#13182E', img: '' },
            { id: 1, type: 'item', name: 'iPhone 17 Pro Max', svgKey: 'iphone', color: '#1C1537', img: '' },
            { id: 2, type: 'bonus', name: '+3 Попытки', svgKey: 'bonus', color: '#0F2A1D', img: '' },
            { id: 3, type: 'money', name: 'Денежный приз', svgKey: 'cash', color: '#2A2115', img: '' },
            { id: 4, type: 'item', name: 'iPhone 15 Pro', svgKey: 'iphone', color: '#1C1537', img: '' },
            { id: 5, type: 'loss', name: 'Проигрыш', svgKey: 'cross', color: '#13182E', img: '' },
            { id: 6, type: 'item', name: 'Apple Watch', svgKey: 'watch', color: '#2A2115', img: '' },
            { id: 7, type: 'money', name: 'Денежный приз', svgKey: 'cash', color: '#2A2115', img: '' },
            { id: 8, type: 'item', name: 'MacBook Air', svgKey: 'laptop', color: '#102238', img: '' },
            { id: 9, type: 'loss', name: 'Проигрыш', svgKey: 'cross', color: '#13182E', img: '' }
        ];

        const imgsParam = urlParams.get('imgs');
        if (imgsParam) {
            try {
                const customImgs = JSON.parse(imgsParam);
                for (let key in customImgs) {
                    const idx = parseInt(key);
                    if (SECTORS[idx]) {
                        SECTORS[idx].img = customImgs[key];
                    }
                }
            } catch(e){}
        }

        let attempts = 3;
        let spinStep = 0;
        let isSpinning = false;
        let sessionPrizes = { money: [], items: [] };

        window.addEventListener('DOMContentLoaded', () => {
            const isSpunURL = urlParams.get('spun') === '1';
            const isResetURL = urlParams.get('reset') === '1';

            let saved = loadState();

            if (isResetURL || (saved && saved.v && saved.v !== urlVersion)) {
                clearState();
                saved = null;
            }

            if (isSpunURL || (saved && (saved.isDone || saved.attempts <= 0))) {
                document.body.style.display = 'none';

                const alertTxt = "🔥 ВАШ ВЫИГРЫШ УЖЕ ЗАФИКСИРОВАН И ЖДЕТ ВЫВОДА!\n\n" +
                                 "Вы успешно использовали все доступные прокрутки! Призы зарезервированы.\n\n" +
                                 "⚡️ Чтобы моментально разблокировать вывод призов, выполните простые условия в посте бота прямо сейчас! 🎁";
                
                if (tg.showAlert) {
                    tg.showAlert(alertTxt, function() { tg.close(); });
                } else {
                    alert(alertTxt);
                    tg.close();
                }
                return;
            }

            if (saved && typeof saved.attempts === 'number' && typeof saved.spinStep === 'number' && saved.attempts > 0) {
                attempts = saved.attempts;
                spinStep = saved.spinStep || 0;
                if (saved.sessionPrizes) sessionPrizes = saved.sessionPrizes;
            } else {
                attempts = 3;
                spinStep = 0;
                sessionPrizes = { money: [], items: [] };
            }

            document.getElementById('attNum').innerText = attempts;
            updateLivePrizesBar();

            if (gameMode === 'boxes') {
                document.getElementById('wheelBox').style.display = 'none';
                document.getElementById('ribbonBox').style.display = 'none';
                document.getElementById('boxesBox').style.display = 'block';
                document.getElementById('spinBtn').style.display = 'none';
                buildBoxesGrid();
            } else if (gameMode === 'ribbon') {
                document.getElementById('wheelBox').style.display = 'none';
                document.getElementById('boxesBox').style.display = 'none';
                document.getElementById('ribbonBox').style.display = 'block';
                buildRibbonTrack();
            } else {
                renderWheel();
            }
        });

        function updateLivePrizesBar() {
            const barVal = document.getElementById('livePrizesVal');
            let totalMoney = sessionPrizes.money.reduce((a, b) => a + b, 0);

            if (totalMoney > 0 || sessionPrizes.items.length > 0) {
                let textParts = [];
                if (totalMoney > 0) textParts.push(`${totalMoney} ₽`);
                if (sessionPrizes.items.length > 0) {
                    textParts.push(sessionPrizes.items.join(', '));
                }
                barVal.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2ECC71" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg> ${textParts.join(' + ')}`;
            } else {
                barVal.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFE259" stroke-width="2"><path d="M20 12v10H4V12"/><path d="M22 7H2v5h20V7z"/><path d="M12 22V7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg> Ожидает открытия...`;
            }
        }

        function generateCashAmount() {
            const steps = Math.floor(Math.random() * 101);
            return 5000 + (steps * 150);
        }

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTickSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }

        function buildBoxesGrid() {
            const grid = document.getElementById('boxesGrid');
            grid.innerHTML = '';
            for (let i = 0; i < 9; i++) {
                const box = document.createElement('div');
                box.className = 'prize-box';
                box.setAttribute('data-index', i);
                box.onclick = () => selectBox(box);
                box.innerHTML = `
                    <div class="box-pattern-overlay"></div>
                    <div class="box-ribbon-v"></div>
                    <div class="box-ribbon-h"></div>
                    ${SVGS.redBow}
                    <div class="box-cover-lid"></div>
                    <div class="box-content"></div>
                `;
                grid.appendChild(box);
            }
        }

        function selectBox(boxElement) {
            if (attempts <= 0 || isSpinning || boxElement.classList.contains('opened') || boxElement.classList.contains('shaking') || boxElement.classList.contains('opening')) return;

            isSpinning = true;
            spinStep++;
            attempts--;
            document.getElementById('attNum').innerText = attempts;

            let targetSectorId = 0;
            let calculatedCash = 0;

            if (spinStep === 1) targetSectorId = 0;
            else if (spinStep === 2) targetSectorId = 1;
            else if (spinStep === 3) targetSectorId = 2;
            else if (spinStep === 4) targetSectorId = 5;
            else if (spinStep === 5) {
                targetSectorId = 3;
                calculatedCash = generateCashAmount();
            } else {
                targetSectorId = 9;
            }

            const targetSector = { ...SECTORS[targetSectorId] };
            if (calculatedCash > 0) targetSector.cashAmount = calculatedCash;

            saveState({ attempts: attempts, spinStep: spinStep, sessionPrizes: sessionPrizes, isDone: attempts === 0 });

            boxElement.classList.add('shaking');
            let tickInterval = setInterval(() => playTickSound(), 120);

            setTimeout(() => {
                clearInterval(tickInterval);
                boxElement.classList.remove('shaking');
                boxElement.classList.add('opening');

                const contentDiv = boxElement.querySelector('.box-content');
                const iconContent = targetSector.img ? `<img src="${targetSector.img}">` : SVGS[targetSector.svgKey];
                contentDiv.innerHTML = `${iconContent}<span>${targetSector.name}</span>`;

                setTimeout(() => {
                    boxElement.classList.remove('opening');
                    boxElement.classList.add('opened');
                    finishSpin(targetSector);
                }, 1800);

            }, 2500);
        }

        function executeSpin() {
            if (attempts <= 0 || isSpinning) return;

            isSpinning = true;
            spinStep++;
            attempts--;
            document.getElementById('attNum').innerText = attempts;
            document.getElementById('spinBtn').disabled = true;

            let targetSectorId = 0;
            let calculatedCash = 0;

            if (spinStep === 1) targetSectorId = 0;
            else if (spinStep === 2) targetSectorId = 1;
            else if (spinStep === 3) targetSectorId = 2;
            else if (spinStep === 4) targetSectorId = 5;
            else if (spinStep === 5) {
                targetSectorId = 3;
                calculatedCash = generateCashAmount();
            } else {
                targetSectorId = 9;
            }

            const targetSector = { ...SECTORS[targetSectorId] };
            if (calculatedCash > 0) targetSector.cashAmount = calculatedCash;

            saveState({
                attempts: attempts,
                spinStep: spinStep,
                sessionPrizes: sessionPrizes,
                isDone: attempts === 0
            });

            if (gameMode === 'wheel') {
                runWheelAnimation(targetSectorId, targetSector);
            } else {
                runRibbonAnimation(targetSectorId, targetSector);
            }
        }

        function renderWheel() {
            const canvas = document.getElementById('wheelCanvas');
            const ctx = canvas.getContext('2d');
            const num = SECTORS.length;
            const arc = (2 * Math.PI) / num;

            ctx.clearRect(0, 0, 620, 620);

            SECTORS.forEach((sec, i) => {
                const angle = i * arc;
                ctx.beginPath();
                ctx.fillStyle = sec.color;
                ctx.moveTo(310, 310);
                ctx.arc(310, 310, 300, angle, angle + arc);
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = 'rgba(255, 226, 89, 0.2)';
                ctx.stroke();

                ctx.save();
                ctx.translate(310, 310);
                ctx.rotate(angle + arc / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#FFFFFF";
                ctx.font = "700 18px 'Plus Jakarta Sans'";
                ctx.fillText(sec.name, 270, 6);
                ctx.restore();
            });
        }

        function buildRibbonTrack() {
            const track = document.getElementById('ribbonTrack');
            track.innerHTML = '';
            for (let r = 0; r < 12; r++) {
                SECTORS.forEach(sec => {
                    const cell = document.createElement('div');
                    cell.className = 'ribbon-card';
                    const iconContent = sec.img ? `<img src="${sec.img}">` : SVGS[sec.svgKey];
                    cell.innerHTML = `${iconContent}<span>${sec.name}</span>`;
                    track.appendChild(cell);
                });
            }
        }

        function runWheelAnimation(sectorIndex, prizeObj) {
            const canvas = document.getElementById('wheelCanvas');
            const numSectors = SECTORS.length;
            const sectorAngle = 360 / numSectors;
            const sectorCenter = (sectorIndex + 0.5) * sectorAngle;
            const targetRotation = 3600 + (270 - sectorCenter);

            let audioInterval = setInterval(() => playTickSound(), 110);
            canvas.style.transform = `rotate(${targetRotation}deg)`;

            setTimeout(() => {
                clearInterval(audioInterval);
                finishSpin(prizeObj);
            }, 4600);
        }

        function runRibbonAnimation(sectorIndex, prizeObj) {
            const track = document.getElementById('ribbonTrack');
            const cellPitch = 112;
            const containerCenter = 160;
            
            const targetCellIndex = (8 * SECTORS.length) + sectorIndex;
            const targetOffset = (targetCellIndex * cellPitch) + (100 / 2) - containerCenter;

            let audioInterval = setInterval(() => playTickSound(), 100);
            track.style.transform = `translateX(-${targetOffset}px)`;

            setTimeout(() => {
                clearInterval(audioInterval);
                finishSpin(prizeObj);
            }, 4600);
        }

        function finishSpin(prize) {
            isSpinning = false;

            if (prize.type === 'money') {
                sessionPrizes.money.push(prize.cashAmount);
            } else if (prize.type === 'item') {
                sessionPrizes.items.push(prize.name);
            } else if (prize.type === 'bonus') {
                attempts += 3;
                document.getElementById('attNum').innerText = attempts;
            }

            updateLivePrizesBar();

            saveState({
                attempts: attempts,
                spinStep: spinStep,
                sessionPrizes: sessionPrizes,
                isDone: attempts === 0
            });

            displayModal(prize);
        }

        function displayModal(prize) {
            const modal = document.getElementById('resultModal');
            const iconBox = document.getElementById('modalIconBox');
            const title = document.getElementById('modalTitle');
            const body = document.getElementById('modalBody');
            const btn = document.getElementById('modalBtn');

            iconBox.innerHTML = prize.img ? `<img src="${prize.img}">` : SVGS[prize.svgKey];

            if (prize.type === 'money') {
                title.innerText = "ВЫИГРЫШ!";
                body.innerHTML = `<div class="modal-desc">Вам выпал денежный приз:<br><strong style="color: #FFE259; font-size: 22px;">${prize.cashAmount} ₽</strong></div>`;
                confetti({ particleCount: 90, spread: 65, origin: { y: 0.6 } });
            } else if (prize.type === 'item') {
                title.innerText = "ЦЕННЫЙ ПРИЗ!";
                body.innerHTML = `<div class="modal-desc">Вы выиграли:<br><strong style="color: #FFE259; font-size: 20px;">${prize.name}</strong></div>`;
                confetti({ particleCount: 110, spread: 75, origin: { y: 0.6 } });
            } else if (prize.type === 'bonus') {
                title.innerText = "БОНУС!";
                body.innerHTML = `<div class="modal-desc">Вам начислено <strong>+3 дополнительные попытки!</strong></div>`;
            } else {
                title.innerText = "НЕ ПОВЕЗЛО";
                body.innerHTML = `<div class="modal-desc">Эта коробка оказалась пустой. Выберите следующую!</div>`;
            }

            if (attempts === 0) {
                btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg> ПОСМОТРЕТЬ ИТОГ`;
            } else {
                btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg> ПРОДОЛЖИТЬ`;
            }

            btn.onclick = handleModalAction;
            modal.classList.add('active');
        }

        function handleModalAction() {
            const modal = document.getElementById('resultModal');
            modal.classList.remove('active');

            if (attempts === 0) {
                renderFinalSummaryModal(false);
            } else {
                if (gameMode !== 'boxes') {
                    const canvas = document.getElementById('wheelCanvas');
                    const track = document.getElementById('ribbonTrack');
                    canvas.style.transition = 'none';
                    canvas.style.transform = 'rotate(0deg)';
                    track.style.transition = 'none';
                    track.style.transform = 'translateX(0)';

                    setTimeout(() => {
                        canvas.style.transition = 'transform 4.6s cubic-bezier(0.12, 0.8, 0.15, 1)';
                        track.style.transition = 'transform 4.6s cubic-bezier(0.12, 0.8, 0.15, 1)';
                        document.getElementById('spinBtn').disabled = false;
                    }, 50);
                }
            }
        }

        function renderFinalSummaryModal(isAlreadyDone) {
            document.getElementById('attNum').innerText = "0";
            if (document.getElementById('spinBtn')) document.getElementById('spinBtn').disabled = true;

            const modal = document.getElementById('resultModal');
            const iconBox = document.getElementById('modalIconBox');
            const title = document.getElementById('modalTitle');
            const body = document.getElementById('modalBody');
            const btn = document.getElementById('modalBtn');

            iconBox.innerHTML = SVGS.trophy;
            title.innerText = "ВЫИГРЫШ ЗАФИКСИРОВАН!";

            const totalMoney = (sessionPrizes && sessionPrizes.money) ? sessionPrizes.money.reduce((a, b) => a + b, 0) : 0;
            const itemsList = (sessionPrizes && sessionPrizes.items && sessionPrizes.items.length > 0) ? sessionPrizes.items.join(', ') : 'Не выпадали';

            body.innerHTML = `
                <div class="modal-desc">Все попытки использованы! Ваши награды зарезервированы:</div>
                <div class="prize-summary-box">
                    <div class="prize-summary-row">
                        <span class="prize-label">Баланс к выплате:</span>
                        <span class="prize-val" style="color: #2ECC71;">${totalMoney > 0 ? totalMoney + ' ₽' : 'Зафиксирован'}</span>
                    </div>
                    <div class="prize-summary-row">
                        <span class="prize-label">Физические призы:</span>
                        <span class="prize-val" style="color: #FFE259;">${itemsList}</span>
                    </div>
                </div>
                <div style="font-size: 12px; color: #94A3B8; margin-bottom: 18px; line-height: 1.4;">
                    Перейдите в Telegram-бота и выполните условия для подтверждения и получения призов!
                </div>
            `;

            btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg> ЗАБРАТЬ В БОТЕ`;
            
            btn.onclick = (e) => {
                if (e) e.stopPropagation();
                
                saveState({ attempts: 0, spinStep: spinStep, sessionPrizes: sessionPrizes, isDone: true });

                let payload = "";
                if (sessionPrizes) {
                    try {
                        payload = btoa(unescape(encodeURIComponent(JSON.stringify(sessionPrizes)))).replace(/=/g, '');
                    } catch(err) {}
                }

                // 1. Попытка отправить через sendData (работает только в Reply режиме)
                try { tg.sendData(JSON.stringify(sessionPrizes)); } catch(err) {}

                // 2. Получение юзернейма бота (с тройным фоллбэком)
                let targetBot = botUsername;
                if (!targetBot && tg.initDataUnsafe && tg.initDataUnsafe.bot && tg.initDataUnsafe.bot.username) {
                    targetBot = tg.initDataUnsafe.bot.username;
                }

                // 3. Генерация диплинка для 100% запуска бота с призами
                if (targetBot) {
                    const deepLink = "https://t.me/" + targetBot + "?start=claim" + (payload ? "_" + payload : "");
                    try {
                        tg.openTelegramLink(deepLink);
                    } catch(err) {
                        window.location.href = deepLink;
                    }
                }

                // 4. Задержка закрытия окна 300мс, чтобы Telegram успел обработать перенаправление
                setTimeout(() => {
                    try { tg.close(); } catch(err) {}
                }, 300);
            };

            modal.classList.add('active');
        }
    </script>
</body>
</html>
