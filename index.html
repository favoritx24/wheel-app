<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VIP FORTUNE CLUB</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0d19;
            --card-bg: rgba(23, 27, 50, 0.75);
            --accent-gold: #ffc837;
            --accent-orange: #ff8008;
            --accent-purple: #8a2be2;
            --accent-neon: #00f2fe;
            --accent-red: #ff4b2b;
            --text-main: #ffffff;
            --text-dim: #8e9aae;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: var(--bg-color);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow: hidden;
            position: relative;
        }

        /* Анимированный фоновый холст */
        #particleCanvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .main-wrapper {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px 15px 30px 15px;
        }

        /* Шапка */
        .header {
            text-align: center;
            width: 100%;
        }

        .title {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #fff 0%, var(--accent-gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            filter: drop-shadow(0 0 12px rgba(255, 200, 55, 0.4));
        }

        .mode-switcher {
            display: flex;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 3px;
            margin: 12px auto 0 auto;
            width: max-content;
            backdrop-filter: blur(10px);
        }

        .mode-btn {
            padding: 6px 16px;
            border-radius: 20px;
            border: none;
            background: transparent;
            color: var(--text-dim);
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .mode-btn.active {
            background: linear-gradient(135deg, var(--accent-orange), var(--accent-gold));
            color: #000;
            font-weight: 800;
            box-shadow: 0 2px 10px rgba(255, 200, 55, 0.4);
        }

        .attempts-card {
            margin-top: 10px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--card-bg);
            border: 1px solid rgba(255, 200, 55, 0.3);
            padding: 6px 18px;
            border-radius: 50px;
            backdrop-filter: blur(12px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        .attempts-badge {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dim);
        }

        .attempts-count {
            font-size: 18px;
            font-weight: 900;
            color: var(--accent-gold);
        }

        /* Секция Игры */
        .game-stage {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
        }

        /* --- КОЛЕСО ФОРТУНЫ --- */
        .wheel-container {
            position: relative;
            width: 320px;
            height: 320px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .wheel-outer-ring {
            position: absolute;
            width: 330px;
            height: 330px;
            border-radius: 50%;
            border: 4px solid var(--accent-gold);
            box-shadow: 0 0 25px rgba(255, 200, 55, 0.5), inset 0 0 15px rgba(255, 200, 55, 0.5);
            z-index: 2;
            pointer-events: none;
        }

        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 16px solid transparent;
            border-right: 16px solid transparent;
            border-top: 32px solid var(--accent-gold);
            z-index: 10;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6));
        }

        #wheelCanvas {
            width: 320px;
            height: 320px;
            border-radius: 50%;
            transition: transform 4.5s cubic-bezier(0.15, 0.85, 0.15, 1);
        }

        /* --- ГОРИЗОНТАЛЬНАЯ ЛЕНТА (СЛОТЫ) --- */
        .ribbon-container {
            display: none;
            position: relative;
            width: 100%;
            max-width: 360px;
            height: 140px;
            background: var(--card-bg);
            border: 2px solid var(--accent-gold);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(255, 200, 55, 0.3);
            backdrop-filter: blur(10px);
        }

        .ribbon-pointer {
            position: absolute;
            top: 0; left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 100%;
            background: var(--accent-gold);
            z-index: 10;
            box-shadow: 0 0 10px var(--accent-gold);
        }

        .ribbon-pointer::before, .ribbon-pointer::after {
            content: '';
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
        }
        .ribbon-pointer::before { top: 0; border-top: 14px solid var(--accent-gold); }
        .ribbon-pointer::after { bottom: 0; border-bottom: 14px solid var(--accent-gold); }

        .ribbon-track {
            display: flex;
            align-items: center;
            height: 100%;
            position: absolute;
            left: 0;
            will-change: transform;
            transition: transform 4.5s cubic-bezier(0.15, 0.85, 0.15, 1);
        }

        .ribbon-item {
            min-width: 110px;
            height: 110px;
            margin: 0 5px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px;
            text-align: center;
        }

        .ribbon-item img {
            width: 45px;
            height: 45px;
            object-fit: contain;
            margin-bottom: 6px;
        }

        .ribbon-item span {
            font-size: 11px;
            font-weight: 700;
            color: #fff;
            line-height: 1.2;
        }

        /* Кнопка запуска */
        .spin-btn {
            width: 100%;
            max-width: 320px;
            padding: 18px 0;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, var(--accent-orange), var(--accent-gold));
            color: #0d0f1d;
            font-family: 'Outfit', sans-serif;
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(255, 128, 8, 0.4);
            transition: all 0.2s ease;
            position: relative;
            z-index: 5;
        }

        .spin-btn:active {
            transform: scale(0.96);
        }

        .spin-btn:disabled {
            background: #2a2e45;
            color: #5a607f;
            box-shadow: none;
            cursor: not-allowed;
        }

        /* ВСПЛЫВАЮЩИЕ ОКНА (МОДАЛКИ) */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(5, 7, 15, 0.85);
            backdrop-filter: blur(15px);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .modal-card {
            background: linear-gradient(145deg, #181c33, #0e1124);
            border: 2px solid var(--accent-gold);
            border-radius: 30px;
            padding: 30px 20px;
            width: 100%;
            max-width: 340px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(255, 200, 55, 0.2);
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.active .modal-card {
            transform: scale(1);
        }

        .modal-icon {
            width: 90px;
            height: 90px;
            margin: 0 auto 15px auto;
            object-fit: contain;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.5));
        }

        .modal-title {
            font-size: 22px;
            font-weight: 900;
            margin: 0 0 10px 0;
            color: var(--accent-gold);
        }

        .modal-desc {
            font-size: 15px;
            color: var(--text-dim);
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .modal-desc strong {
            color: #fff;
        }

        .modal-btn {
            width: 100%;
            padding: 15px 0;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, var(--accent-orange), var(--accent-gold));
            color: #000;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(255, 200, 55, 0.3);
        }

        .timer-text {
            font-size: 12px;
            color: var(--text-dim);
            margin-top: 12px;
        }
    </style>
</head>
<body>

    <canvas id="particleCanvas"></canvas>

    <div class="main-wrapper">
        <!-- Шапка -->
        <div class="header">
            <h1 class="title">КЭШ-МАГНАТ</h1>
            <div class="mode-switcher">
                <button class="mode-btn active" id="btnWheelMode" onclick="switchMode('wheel')">🎡 Колесо</button>
                <button class="mode-btn" id="btnRibbonMode" onclick="switchMode('ribbon')">🎰 Лента</button>
            </div>
            <div class="attempts-card">
                <span class="attempts-badge">Осталось попыток:</span>
                <span class="attempts-count" id="attCount">3</span>
            </div>
        </div>

        <!-- Игровое Поле -->
        <div class="game-stage">
            <!-- Режим Колеса -->
            <div class="wheel-container" id="wheelView">
                <div class="wheel-outer-ring"></div>
                <div class="pointer"></div>
                <canvas id="wheelCanvas" width="640" height="640"></canvas>
            </div>

            <!-- Режим Ленты -->
            <div class="ribbon-container" id="ribbonView">
                <div class="ribbon-pointer"></div>
                <div class="ribbon-track" id="ribbonTrack"></div>
            </div>
        </div>

        <!-- Кнопка действия -->
        <button class="spin-btn" id="spinBtn" onclick="startSpin()">КРУТИТЬ</button>
    </div>

    <!-- Модальное окно результата -->
    <div class="modal-overlay" id="resultModal">
        <div class="modal-card">
            <img src="" id="modalImg" class="modal-icon" alt="Prize">
            <h2 class="modal-title" id="modalTitle">ВЫИГРЫШ!</h2>
            <div class="modal-desc" id="modalDesc"></div>
            <button class="modal-btn" id="modalBtn" onclick="closeModal()">ПРОДОЛЖИТЬ</button>
            <div class="timer-text" id="modalTimer"></div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // --- СОСТОЯНИЕ ИГРЫ ---
        let attempts = 3;
        let currentMode = 'wheel'; // 'wheel' или 'ribbon'
        let isSpinning = false;
        let sessionPrizes = { money: [], items: [] };
        let modalTimerInterval = null;

        // --- БАЗА ПРИЗОВ С КАРТИНКАМИ И НАСТРОЙКАМИ ВЕСА ---
        const PRIZES = [
            { id: 1, type: 'money', name: 'Денежный приз', img: 'https://cdn-icons-png.flaticon.com/512/2489/2489756.png', color: '#eb4d4b' },
            { id: 2, type: 'item', name: 'iPhone 15 Pro', img: 'https://cdn-icons-png.flaticon.com/512/0/191.png', color: '#f0932b' },
            { id: 3, type: 'bonus', name: '+3 Попытки', img: 'https://cdn-icons-png.flaticon.com/512/616/616490.png', color: '#be2edd' },
            { id: 4, type: 'money', name: 'Денежный приз', img: 'https://cdn-icons-png.flaticon.com/512/2489/2489756.png', color: '#6ab04c' },
            { id: 5, type: 'loss', name: 'Пусто', img: 'https://cdn-icons-png.flaticon.com/512/1828/1828843.png', color: '#4834d4' },
            { id: 6, type: 'item', name: 'AirPods Pro 2', img: 'https://cdn-icons-png.flaticon.com/512/2742/2742058.png', color: '#f9ca24' }
        ];

        // --- ГЕНЕРАЦИЯ СЛУЧАЙНЫХ ДЕНЕГ (От 5000 до 15000 с шагом 100) ---
        function getRandomMoney() {
            const min = 50; // 5000 / 100
            const max = 150; // 15000 / 100
            const randomStep = Math.floor(Math.random() * (max - min + 1)) + min;
            return randomStep * 100;
        }

        // --- АУДИО ЭФФЕКТЫ (Web Audio API) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTickSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }

        // --- ИНИЦИАЛИЗАЦИЯ И ОТРИСОВКА ---
        window.onload = () => {
            initParticles();
            drawWheel();
            buildRibbon();
        };

        // Переключение режимов
        function switchMode(mode) {
            if (isSpinning) return;
            currentMode = mode;
            document.getElementById('btnWheelMode').classList.toggle('active', mode === 'wheel');
            document.getElementById('btnRibbonMode').classList.toggle('active', mode === 'ribbon');
            document.getElementById('wheelView').style.display = mode === 'wheel' ? 'flex' : 'none';
            document.getElementById('ribbonView').style.display = mode === 'ribbon' ? 'block' : 'none';
        }

        // Отрисовка Колеса
        function drawWheel() {
            const canvas = document.getElementById('wheelCanvas');
            const ctx = canvas.getContext('2d');
            const numSectors = PRIZES.length;
            const arc = (2 * Math.PI) / numSectors;

            ctx.clearRect(0, 0, 640, 640);

            PRIZES.forEach((prize, i) => {
                const angle = i * arc;
                ctx.beginPath();
                ctx.fillStyle = prize.color;
                ctx.moveTo(320, 320);
                ctx.arc(320, 320, 310, angle, angle + arc);
                ctx.fill();
                ctx.stroke();

                // Текст и Тень
                ctx.save();
                ctx.translate(320, 320);
                ctx.rotate(angle + arc / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#fff";
                ctx.font = "bold 24px Outfit";
                ctx.fillText(prize.name, 280, 10);
                ctx.restore();
            });
        }

        // Построение Ленты
        function buildRibbon() {
            const track = document.getElementById('ribbonTrack');
            track.innerHTML = '';
            // Создаем многократный повтор элементов для бесконечной ленты
            for (let i = 0; i < 12; i++) {
                PRIZES.forEach(p => {
                    const item = document.createElement('div');
                    item.className = 'ribbon-item';
                    item.innerHTML = `<img src="${p.img}"><span>${p.name}</span>`;
                    track.appendChild(item);
                });
            }
        }

        // --- ЛОГИКА ВРАЩЕНИЯ ---
        function startSpin() {
            if (attempts <= 0 || isSpinning) return;

            isSpinning = true;
            attempts--;
            document.getElementById('attCount').innerText = attempts;
            document.getElementById('spinBtn').disabled = true;

            // Выбираем случайный приз
            const prizeIndex = Math.floor(Math.random() * PRIZES.length);
            const selectedPrize = { ...PRIZES[prizeIndex] };

            if (selectedPrize.type === 'money') {
                selectedPrize.amount = getRandomMoney();
            }

            if (currentMode === 'wheel') {
                spinWheel(prizeIndex, selectedPrize);
            } else {
                spinRibbon(prizeIndex, selectedPrize);
            }
        }

        function spinWheel(index, prize) {
            const canvas = document.getElementById('wheelCanvas');
            const numSectors = PRIZES.length;
            const sectorDegree = 360 / numSectors;
            
            // Расчет угла для точного попадания под стрелку
            const targetDegree = 3600 + (360 - (index * sectorDegree) - (sectorDegree / 2));

            let currentAudioTick = 0;
            const tickInterval = setInterval(() => {
                currentAudioTick++;
                playTickSound();
                if (currentAudioTick > 30) clearInterval(tickInterval);
            }, 120);

            canvas.style.transform = `rotate(${targetDegree}deg)`;

            setTimeout(() => {
                clearInterval(tickInterval);
                processPrize(prize);
            }, 4600);
        }

        function spinRibbon(index, prize) {
            const track = document.getElementById('ribbonTrack');
            const itemWidth = 120; // 110px + 10px margins
            const baseOffset = (7 * PRIZES.length + index) * itemWidth; 

            const tickInterval = setInterval(() => {
                playTickSound();
            }, 100);

            track.style.transform = `translateX(-${baseOffset}px)`;

            setTimeout(() => {
                clearInterval(tickInterval);
                processPrize(prize);
            }, 4600);
        }

        // --- ОБРАБОТКА ВЫИГРЫША ---
        function processPrize(prize) {
            isSpinning = false;

            // Логика добавления призов
            if (prize.type === 'money') {
                sessionPrizes.money.push(prize.amount);
            } else if (prize.type === 'item') {
                sessionPrizes.items.push(prize.name);
            } else if (prize.type === 'bonus') {
                attempts += 3;
                document.getElementById('attCount').innerText = attempts;
            }

            // Показываем промежуточную модалку
            showModal(prize);
        }

        // --- ВСПЛЫВАЮЩИЕ ОКНА ---
        function showModal(prize) {
            const modal = document.getElementById('resultModal');
            const title = document.getElementById('modalTitle');
            const desc = document.getElementById('modalDesc');
            const img = document.getElementById('modalImg');
            const btn = document.getElementById('modalBtn');
            const timerText = document.getElementById('modalTimer');

            img.src = prize.img;

            if (prize.type === 'money') {
                title.innerText = "ОТЛИЧНЫЙ КУШ!";
                desc.innerHTML = `Вы выиграли: <strong>${prize.amount} ₽</strong>`;
                confetti({ particleCount: 80, spread: 60 });
            } else if (prize.type === 'item') {
                title.innerText = "ЦЕННЫЙ ПРИЗ!";
                desc.innerHTML = `Ваш выигрыш: <strong>${prize.name}</strong>`;
                confetti({ particleCount: 100, spread: 70 });
            } else if (prize.type === 'bonus') {
                title.innerText = "СУПЕР БОНУС!";
                desc.innerHTML = `Вам начислено <strong>+3 дополнительные попытки!</strong>`;
            } else {
                title.innerText = "УВЫ, ПУСТО!";
                desc.innerHTML = `В этой ячейке ничего нет. Повезет в следующий раз!`;
            }

            // Если попыток больше нет — готовим финальный забор приза
            if (attempts === 0) {
                btn.innerText = "ЗАБРАТЬ ВСЕ ПРИЗЫ 🎁";
                let timeLeft = 5;
                timerText.innerText = `Автоматический забор через ${timeLeft}с...`;
                
                modalTimerInterval = setInterval(() => {
                    timeLeft--;
                    timerText.innerText = `Автоматический забор через ${timeLeft}с...`;
                    if (timeLeft <= 0) {
                        clearInterval(modalTimerInterval);
                        claimFinalPrizes();
                    }
                }, 1000);
            } else {
                btn.innerText = "ПРОДОЛЖИТЬ";
                timerText.innerText = "";
            }

            modal.classList.add('active');
        }

        function closeModal() {
            const modal = document.getElementById('resultModal');
            modal.classList.remove('active');

            if (modalTimerInterval) clearInterval(modalTimerInterval);

            if (attempts === 0) {
                claimFinalPrizes();
            } else {
                // Сброс позиций для нового кручения
                const canvas = document.getElementById('wheelCanvas');
                const track = document.getElementById('ribbonTrack');
                canvas.style.transition = 'none';
                canvas.style.transform = 'rotate(0deg)';
                track.style.transition = 'none';
                track.style.transform = 'translateX(0)';

                setTimeout(() => {
                    canvas.style.transition = 'transform 4.5s cubic-bezier(0.15, 0.85, 0.15, 1)';
                    track.style.transition = 'transform 4.5s cubic-bezier(0.15, 0.85, 0.15, 1)';
                    document.getElementById('spinBtn').disabled = false;
                }, 50);
            }
        }

        function claimFinalPrizes() {
            // ГАРАНТИРОВАННАЯ ОТПРАВКА ДАННЫХ И ЗАКРЫТИЕ ПРИЛОЖЕНИЯ
            const payload = JSON.stringify(sessionPrizes);
            try {
                tg.sendData(payload);
            } catch (e) {
                console.error("Ошибка при отправке в TG:", e);
            }
            setTimeout(() => {
                tg.close();
            }, 100);
        }

        // --- АНИМАЦИЯ ФОНОВЫХ ЧАСТИЦ ---
        function initParticles() {
            const canvas = document.getElementById('particleCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = Array.from({ length: 35 }, () => ({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 3 + 1,
                speedY: Math.random() * 0.8 + 0.2,
                opacity: Math.random() * 0.5 + 0.2
            }));

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => {
                    p.y -= p.speedY;
                    if (p.y < 0) p.y = canvas.height;
                    ctx.fillStyle = `rgba(255, 200, 55, ${p.opacity})`;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                });
                requestAnimationFrame(animate);
            }
            animate();
        }
    </script>
</body>
</html>
