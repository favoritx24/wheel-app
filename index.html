<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wheel Fix</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body { background: #0e0e0e; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        .wheel-box { position: relative; width: 320px; height: 320px; margin-top: 20px; }
        canvas { width: 100%; height: 100%; }
        .pointer { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 35px solid #00f2ff; z-index: 100; filter: drop-shadow(0 0 5px #00f2ff); }
        .btn { margin-top: 40px; padding: 15px 50px; background: #00f2ff; color: #000; border: none; border-radius: 50px; font-weight: bold; font-size: 18px; cursor: pointer; box-shadow: 0 0 20px rgba(0, 242, 255, 0.4); }
        .btn:disabled { background: #333; color: #666; box-shadow: none; }
        #popup { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 200; }
        .card { background: #1a1a1a; padding: 30px; border-radius: 20px; border: 2px solid #00f2ff; text-align: center; width: 80%; max-width: 300px; }
    </style>
</head>

    <div class="wheel-box">

        <canvas id="canvas"></canvas>
    </div>
    <button class="btn" id="spin">КРУТИТЬ</button>

    <div id="popup">
        <div class="card">
            <h2 id="popStatus">ВЫИГРЫШ!</h2>
            <h1 id="popValue">---</h1>
            <button class="btn" id="claim">ЗАБРАТЬ</button>
        </div>
    </div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // 10 секторов. Важно: порядок секторов в массиве должен совпадать с их отрисовкой
    const prizes = [
        { n: 'Проигрыш', i: '❌', t: 'loss' },   // 0
        { n: 'iPhone 15', i: '📱', t: 'item' },  // 1
        { n: '+3 Попытки', i: '⚡️', t: 'bonus' }, // 2
        { n: 'Проигрыш', i: '❌', t: 'loss' },   // 3

        { n: 'Денежный приз', i: '💰', t: 'money' }, // 5
        { n: 'MacBook Air', i: '💻', t: 'item' }, // 6
        { n: 'Проигрыш', i: '❌', t: 'loss' },   // 7
        { n: 'Проигрыш', i: '❌', t: 'loss' },   // 8
        { n: 'Проигрыш', i: '❌', t: 'loss' }    // 9
    ];

    // Последовательность шагов:
    const sequence = [0, 1, 2, 3, 4, 5];
    let step = 0;
    let attempts = 3;
    let wonMoney = 0;
    let wonItems = [];

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const spinBtn = document.getElementById('spin');

    function draw() {
        const size = 400; canvas.width = size; canvas.height = size;
        const center = 200;
        const slice = (Math.PI * 2) / prizes.length;

        prizes.forEach((p, i) => {
            ctx.beginPath();
            ctx.fillStyle = i % 2 === 0 ? '#111' : '#1a1a1a';
            ctx.moveTo(center, center);
            // Рисуем от -90 градусов (верхняя точка), чтобы i=0 был ровно вверху
            let startAngle = slice * i - Math.PI / 2;
            let endAngle = slice * (i + 1) - Math.PI / 2;
            ctx.arc(center, center, 190, startAngle, endAngle);
            ctx.fill();
            
            ctx.save();
            ctx.translate(center, center);
            ctx.rotate(slice * i + slice / 2 - Math.PI / 2);
            ctx.fillStyle = "white";
            ctx.font = "bold 24px Arial";
            ctx.textAlign = "center";
            ctx.fillText(p.i, 140, 10);
            ctx.restore();
        });
    }
    draw();

    spinBtn.onclick = () => {
        if (attempts <= 0) return;
        spinBtn.disabled = true;
        attempts--;
        document.getElementById('att').innerText = attempts;

        const winnerIdx = sequence[step] || 0;
        const winner = prizes[winnerIdx];
        
        // Расчет вращения:
        // Каждый сектор занимает 36 градусов (360 / 10)
        // Чтобы индекс i оказался сверху, нужно повернуть на 360 - (i * 36) градусов
        const sectorAngle = 360 / prizes.length;
        const extraDeg = 360 - (winnerIdx * sectorAngle);
        const totalRotation = (360 * 10) + extraDeg; // 10 полных оборотов + угол до сектора

        canvas.style.transition = 'transform 5s cubic-bezier(0.15, 0, 0.15, 1)';
        canvas.style.transform = `rotate(${totalRotation}deg)`;

        setTimeout(() => {
            finalize(winner);
        }, 5200);
    };
