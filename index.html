<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wheel Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body { background: #0a0a0a; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        .wheel-box { position: relative; width: 320px; height: 320px; }
        canvas { width: 100%; height: 100%; border-radius: 50%; }
        .pointer { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 30px solid #ff0055; z-index: 10; }
        .btn { margin-top: 30px; padding: 15px 40px; background: #ff0055; color: white; border: none; border-radius: 50px; font-weight: bold; font-size: 18px; cursor: pointer; box-shadow: 0 0 20px rgba(255,0,85,0.5); }
        .btn:disabled { background: #333; box-shadow: none; }
        #popup { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center; }
        .card { background: #111; padding: 30px; border: 1px solid #ff0055; border-radius: 20px; width: 80%; }
    </style>
</head>
<body>
    <h2 style="color: #ff0055; margin-bottom: 5px;">КЭШ-МАГНАТ</h2>
    <div style="margin-bottom: 20px;">Попыток: <span id="att">3</span></div>
    
    <div class="wheel-box">
        <div class="pointer"></div>
        <canvas id="canvas"></canvas>
    </div>
    <button class="btn" id="spin">КРУТИТЬ</button>

    <div id="popup">
        <div class="card">
            <h2 id="popStatus">ВЫИГРЫШ!</h2>
            <h1 id="popValue">iPhone 15</h1>
            <button class="btn" id="claim">ЗАБРАТЬ</button>
        </div>
    </div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // 10 секторов для красоты. Проигрыш на индексах 0, 3, 4, 7, 8, 9
    const prizes = [
        { n: 'Проигрыш', i: '❌', t: 'loss' }, // 0
        { n: 'iPhone 15', i: '📱', t: 'item' }, // 1
        { n: '+3 Попытки', i: '⚡️', t: 'bonus' }, // 2
        { n: 'Проигрыш', i: '❌', t: 'loss' }, // 3
        { n: 'Проигрыш', i: '❌', t: 'loss' }, // 4
        { n: 'Денежный приз', i: '💰', t: 'money' }, // 5
        { n: 'MacBook Air', i: '💻', t: 'item' }, // 6
        { n: 'Проигрыш', i: '❌', t: 'loss' }, // 7
        { n: 'Проигрыш', i: '❌', t: 'loss' }, // 8
        { n: 'Проигрыш', i: '❌', t: 'loss' }  // 9
    ];

    // Порядок выпадения по вашему списку:
    const sequence = [0, 1, 2, 3, 4, 5];
    let step = 0;
    let attempts = 3;
    let wonMoney = 0;
    let wonItems = [];

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const spinBtn = document.getElementById('spin');

    function draw() {
        const size = 400; canvas.width = size; canvas.height = size;
        const slice = (Math.PI * 2) / prizes.length;
        prizes.forEach((p, i) => {
            ctx.beginPath();
            ctx.fillStyle = i % 2 === 0 ? '#111' : '#1a1a1a';
            ctx.moveTo(200, 200);
            // Рисуем так, чтобы 0 сектор был сверху (смещение -PI/2)
            ctx.arc(200, 200, 190, slice * i - Math.PI/2, slice * (i+1) - Math.PI/2);
            ctx.fill();
            ctx.save();
            ctx.translate(200, 200);
            ctx.rotate(slice * i + slice/2 - Math.PI/2);
            ctx.fillStyle = "white"; ctx.font = "bold 20px Arial";
            ctx.fillText(p.i, 130, 10);
            ctx.restore();
        });
    }
    draw();

    spinBtn.onclick = () => {
        if(attempts <= 0) return;
        spinBtn.disabled = true;
        attempts--;
        document.getElementById('att').innerText = attempts;

        const winnerIdx = sequence[step] || 0;
        const winner = prizes[winnerIdx];
        
        // Математика поворота: 3600 (10 кругов) + угол до нужного сектора
        // Поскольку сектор 0 стоит вверху, угол до сектора i = 360 - (i * 36)
        const rotation = 3600 + (360 - (winnerIdx * (360 / prizes.length)));
        
        canvas.style.transition = 'transform 5s cubic-bezier(0.15, 0, 0.15, 1)';
        canvas.style.transform = `rotate(${rotation}deg)`;

        setTimeout(() => finalize(winner), 5200);
    };

    function finalize(winner) {
        step++;
        let valText = winner.n;
        
        if(winner.t === 'loss') {
            document.getElementById('popStatus').innerText = "УПС...";
            valText = "Ничего не выпало";
        } else if(winner.t === 'bonus') {
            document.getElementById('popStatus').innerText = "БОНУС!";
            attempts += 3;
            document.getElementById('att').innerText = attempts;
        } else if(winner.t === 'money') {
            const sum = Math.floor(Math.random() * (150 - 30 + 1) + 30) * 100;
            wonMoney += sum;
            valText = sum + " руб.";
        } else {
            wonItems.push(winner.n);
        }

        document.getElementById('popValue').innerText = valText;
        document.getElementById('popup').style.display = 'flex';
        confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
    }

    document.getElementById('claim').onclick = () => {
        document.getElementById('popup').style.display = 'none';
        if(attempts > 0) {
            spinBtn.disabled = false;
            canvas.style.transition = 'none';
            canvas.style.transform = 'rotate(0deg)';
        } else {
            const res = { money: wonMoney, items: wonItems.join(", ") };
            tg.sendData(JSON.stringify(res));
        }
    };
</script>
</body>
</html>
