<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VIP Fortune Club</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #070913;
            --card-bg: rgba(19, 24, 44, 0.75);
            --gold-light: #FFE259;
            --gold-dark: #FFA751;
            --accent-purple: #7B2CBF;
            --text-main: #FFFFFF;
            --text-muted: #8E9BAE;
            --border-glow: rgba(255, 226, 89, 0.25);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
            position: relative;
            margin: 0;
            padding: 0;
        }

        /* Фоновый блюр и свечение */
        .glow-bg {
            position: absolute;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(123, 44, 191, 0.35) 0%, rgba(0,0,0,0) 70%);
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 420px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px 28px 20px;
        }

        /* Шапка */
        .header {
            text-align: center;
            width: 100%;
        }

        .brand-title {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #FFFFFF 0%, var(--gold-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0 0 8px 0;
        }

        .attempts-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            padding: 6px 16px;
            border-radius: 30px;
            backdrop-filter: blur(15px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .attempts-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .attempts-value {
            font-size: 15px;
            font-weight: 800;
            color: var(--gold-light);
        }

        /* Игровое поле */
        .stage {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
        }

        /* === 1. КОЛЕСО ФОРТУНЫ === */
        .wheel-box {
            position: relative;
            width: 310px;
            height: 310px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .wheel-outer-frame {
            position: absolute;
            width: 322px;
            height: 322px;
            border-radius: 50%;
            border: 3px solid var(--gold-light);
            box-shadow: 0 0 25px rgba(255, 226, 89, 0.3), inset 0 0 15px rgba(255, 226, 89, 0.2);
            z-index: 3;
            pointer-events: none;
        }

        .pointer-svg {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 28px;
            height: 34px;
            z-index: 10;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.7));
        }

        #wheelCanvas {
            width: 310px;
            height: 310px;
            border-radius: 50%;
            transition: transform 4.5s cubic-bezier(0.12, 0.8, 0.15, 1);
            will-change: transform;
        }

        /* === 2. ГОРИЗОНТАЛЬНАЯ ЛЕНТА === */
        .ribbon-box {
            display: none;
            position: relative;
            width: 100%;
            height: 130px;
            background: var(--card-bg);
            border: 2px solid var(--border-glow);
            border-radius: 20px;
            overflow: hidden;
            backdrop-filter: blur(20px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .ribbon-indicator {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 3px;
            height: 100%;
            background: linear-gradient(180deg, var(--gold-light), var(--gold-dark));
            z-index: 10;
            box-shadow: 0 0 10px var(--gold-light);
        }

        .ribbon-track {
            display: flex;
            align-items: center;
            height: 100%;
            position: absolute;
            left: 0;
            will-change: transform;
            transition: transform 4.5s cubic-bezier(0.12, 0.8, 0.15, 1);
        }

        .ribbon-cell {
            width: 100px;
            height: 100px;
            margin: 0 5px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px;
            gap: 6px;
            flex-shrink: 0;
        }

        .ribbon-cell svg {
            width: 32px;
            height: 32px;
        }

        .ribbon-cell span {
            font-size: 10px;
            font-weight: 700;
            color: var(--text-main);
            text-align: center;
            line-height: 1.1;
        }

        /* Кнопка */
        .action-btn {
            width: 100%;
            padding: 16px 0;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold-dark) 100%);
            color: #070913;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(255, 167, 81, 0.35);
            transition: transform 0.15s ease, opacity 0.2s ease;
        }

        .action-btn:active {
            transform: scale(0.97);
        }

        .action-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        /* Модальные окна */
        .modal-mask {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(4, 6, 14, 0.88);
            backdrop-filter: blur(12px);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .modal-mask.show {
            display: flex;
            opacity: 1;
        }

        .modal-card {
            background: linear-gradient(160deg, #14192d 0%, #0a0d1a 100%);
            border: 1px solid var(--border-glow);
            border-radius: 24px;
            padding: 28px 20px;
            width: 100%;
            max-width: 320px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
            transform: scale(0.85);
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-mask.show .modal-card {
            transform: scale(1);
        }

        .modal-icon-wrap {
            width: 72px;
            height: 72px;
            margin: 0 auto 16px auto;
            background: rgba(255, 226, 89, 0.08);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 226, 89, 0.2);
        }

        .modal-icon-wrap svg {
            width: 38px;
            height: 38px;
        }

        .modal-headline {
            font-size: 18px;
            font-weight: 800;
            color: var(--gold-light);
            margin: 0 0 8px 0;
            text-transform: uppercase;
        }

        .modal-subtext {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 22px;
            line-height: 1.4;
        }

        .modal-btn {
            width: 100%;
            padding: 14px 0;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, var(--gold-light), var(--gold-dark));
            color: #070913;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            text-transform: uppercase;
        }

        .modal-timer {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="glow-bg"></div>

    <div class="container">
        <!-- Шапка -->
        <div class="header">
            <h1 class="brand-title">VIP FORTUNE CLUB</h1>
            <div class="attempts-pill">
                <span class="attempts-label">Доступно попыток:</span>
                <span class="attempts-value" id="attCounter">3</span>
            </div>
        </div>

        <!-- Игровое Поле -->
        <div class="stage">
            <!-- Колесо -->
            <div class="wheel-box" id="wheelBox">
                <div class="wheel-outer-frame"></div>
                <svg class="pointer-svg" viewBox="0 0 28 34" fill="none">
                    <path d="M14 34L0 0H28L14 34Z" fill="url(#ptrG)"/>
                    <defs>
                        <linearGradient id="ptrG" x1="14" y1="0" x2="14" y2="34" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#FFE259"/>
                            <stop offset="1" stop-color="#FFA751"/>
                        </linearGradient>
                    </defs>
                </svg>
                <canvas id="wheelCanvas" width="620" height="620"></canvas>
            </div>

            <!-- Лента -->
            <div class="ribbon-box" id="ribbonBox">
                <div class="ribbon-indicator"></div>
                <div class="ribbon-track" id="ribbonTrack"></div>
            </div>
        </div>

        <!-- Кнопка Вращения -->
        <button class="action-btn" id="spinBtn" onclick="executeSpin()">КРУТИТЬ</button>
    </div>

    <!-- Модалка Результата -->
    <div class="modal-mask" id="resultModal">
        <div class="modal-card">
            <div class="modal-icon-wrap" id="modalIconBox"></div>
            <h2 class="modal-headline" id="modalHeadline">ВЫИГРЫШ!</h2>
            <p class="modal-subtext" id="modalSubtext"></p>
            <button class="modal-btn" id="modalBtn" onclick="dismissModal()">ПРОДОЛЖИТЬ</button>
            <div class="modal-timer" id="modalTimer"></div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Идентификатор пользователя для локального хранилища
        const userId = tg.initDataUnsafe?.user?.id || 'guest_user';

        // --- ВЕКТОРНЫЕ SVG ИКОНКИ ---
        const SVGS = {
            cross: `<svg viewBox="0 0 24 24" fill="none" stroke="#FF4B4B" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`,
            headphones: `<svg viewBox="0 0 24 24" fill="none" stroke="#FFE259" stroke-width="2" stroke-linecap="round"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg>`,
            bonus: `<svg viewBox="0 0 24 24" fill="none" stroke="#2ECC71" stroke-width="2" stroke-linecap="round"><path d="M20 12v10H4V12"/><path d="M22 7H2v5h20V7z"/><path d="M12 22V7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>`,
            cash: `<svg viewBox="0 0 24 24" fill="none" stroke="#2ECC71" stroke-width="2" stroke-linecap="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/><path d="M6 12h.01M18 12h.01"/></svg>`,
            iphone: `<svg viewBox="0 0 24 24" fill="none" stroke="#9B51E0" stroke-width="2" stroke-linecap="round"><rect x="5" y="2" width="14" height="20" rx="3"/><path d="M12 18h.01"/></svg>`,
            watch: `<svg viewBox="0 0 24 24" fill="none" stroke="#F2994A" stroke-width="2" stroke-linecap="round"><rect x="6" y="7" width="12" height="10" rx="3"/><path d="M9 3h6v4H9zM9 17h6v4H9z"/></svg>`,
            laptop: `<svg viewBox="0 0 24 24" fill="none" stroke="#2F80ED" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M2 20h20"/></svg>`,
            lock: `<svg viewBox="0 0 24 24" fill="none" stroke="#FFE259" stroke-width="2" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>`
        };

        // --- 10 СЕКТОРОВ ---
        const SECTORS = [
            { id: 0, type: 'loss', name: 'Проигрыш', svgKey: 'cross', color: '#13182E' },
            { id: 1, type: 'item', name: 'AirPods Pro 2', svgKey: 'headphones', color: '#1C1537' },
            { id: 2, type: 'bonus', name: '+3 Попытки', svgKey: 'bonus', color: '#0F2A1D' },
            { id: 3, type: 'money', name: 'Денежный приз', svgKey: 'cash', color: '#2A2115' },
            { id: 4, type: 'item', name: 'iPhone 15 Pro', svgKey: 'iphone', color: '#1C1537' },
            { id: 5, type: 'loss', name: 'Проигрыш', svgKey: 'cross', color: '#13182E' },
            { id: 6, type: 'item', name: 'Apple Watch', svgKey: 'watch', color: '#2A2115' },
            { id: 7, type: 'money', name: 'Денежный приз', svgKey: 'cash', color: '#2A2115' },
            { id: 8, type: 'item', name: 'MacBook Air', svgKey: 'laptop', color: '#102238' },
            { id: 9, type: 'loss', name: 'Проигрыш', svgKey: 'cross', color: '#13182E' }
        ];

        // --- СОСТОЯНИЕ ---
        let attempts = 3;
        let spinStep = 0;
        let isSpinning = false;
        let sessionPrizes = { money: [], items: [] };
        let timerRef = null;

        const urlParams = new URLSearchParams(window.location.search);
        const gameMode = urlParams.get('mode') === 'ribbon' ? 'ribbon' : 'wheel';

        // Инициализация при загрузке
        window.addEventListener('DOMContentLoaded', () => {
            // ПРОВЕРКА: Если пользователь уже отыграл ранее
            if (localStorage.getItem('spun_done_' + userId) === 'true') {
                showAlreadySpunModal();
                return;
            }

            if (gameMode === 'ribbon') {
                document.getElementById('wheelBox').style.display = 'none';
                document.getElementById('ribbonBox').style.display = 'block';
                buildRibbonTrack();
            } else {
                renderWheel();
            }
        });

        // ЭКРАН ЕСЛИ ВСЕ ПОПЫТКИ ИСПОЛЬЗОВАНЫ
        function showAlreadySpunModal() {
            document.getElementById('attCounter').innerText = "0";
            document.getElementById('spinBtn').disabled = true;

            const modal = document.getElementById('resultModal');
            document.getElementById('modalIconBox').innerHTML = SVGS.lock;
            document.getElementById('modalHeadline').innerText = "ПОПЫТКИ ИСЧЕРПАНЫ";
            document.getElementById('modalSubtext').innerHTML = "Вы уже сыграли все доступные попытки.<br>Перейдите в бота, чтобы забрать ваш приз!";
            
            const btn = document.getElementById('modalBtn');
            btn.innerText = "К УСЛОВИЯМ ВЫВОДА 🎁";
            btn.onclick = () => {
                tg.sendData(JSON.stringify({ alreadySpun: true }));
                tg.close();
            };

            document.getElementById('modalTimer').innerText = "";
            modal.classList.add('show');
        }

        // Генерация суммы (5000 - 15000)
        function generateCashAmount() {
            const steps = Math.floor(Math.random() * 101);
            return 5000 + (steps * 100);
        }

        // Звуковой клик
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playClickSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.04);
        }

        // Отрисовка Колеса
        function renderWheel() {
            const canvas = document.getElementById('wheelCanvas');
            const ctx = canvas.getContext('2d');
            const num = SECTORS.length;
            const arc = (2 * Math.PI) / num;

            ctx.clearRect(0, 0, 620, 620);

            SECTORS.forEach((sec, i) => {
                const angle = i * arc;
                
                ctx.beginPath();
                ctx.fillStyle = sec.color;
                ctx.moveTo(310, 310);
                ctx.arc(310, 310, 300, angle, angle + arc);
                ctx.fill();

                ctx.lineWidth = 2;
                ctx.strokeStyle = 'rgba(255, 226, 89, 0.15)';
                ctx.stroke();

                ctx.save();
                ctx.translate(310, 310);
                ctx.rotate(angle + arc / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#FFFFFF";
                ctx.font = "600 20px 'Plus Jakarta Sans'";
                ctx.fillText(sec.name, 270, 7);
                ctx.restore();
            });
        }

        // Построение Ленты
        function buildRibbonTrack() {
            const track = document.getElementById('ribbonTrack');
            track.innerHTML = '';
            for (let r = 0; r < 12; r++) {
                SECTORS.forEach(sec => {
                    const cell = document.createElement('div');
                    cell.className = 'ribbon-cell';
                    cell.innerHTML = `${SVGS[sec.svgKey]}<span>${sec.name}</span>`;
                    track.appendChild(cell);
                });
            }
        }

        // ЗАПУСК ВРАЩЕНИЯ
        function executeSpin() {
            if (attempts <= 0 || isSpinning) return;

            isSpinning = true;
            spinStep++;
            attempts--;
            document.getElementById('attCounter').innerText = attempts;
            document.getElementById('spinBtn').disabled = true;

            let targetSectorId = 0;
            let calculatedCash = 0;

            if (spinStep === 1) targetSectorId = 0;
            else if (spinStep === 2) targetSectorId = 1;
            else if (spinStep === 3) targetSectorId = 2;
            else if (spinStep === 4) targetSectorId = 5;
            else if (spinStep === 5) {
                targetSectorId = 3;
                calculatedCash = generateCashAmount();
            } else {
                targetSectorId = 9;
            }

            const targetSector = { ...SECTORS[targetSectorId] };
            if (calculatedCash > 0) targetSector.cashAmount = calculatedCash;

            if (gameMode === 'wheel') {
                runWheelAnimation(targetSectorId, targetSector);
            } else {
                runRibbonAnimation(targetSectorId, targetSector);
            }
        }

        // Анимация Колеса
        function runWheelAnimation(sectorIndex, prizeObj) {
            const canvas = document.getElementById('wheelCanvas');
            const numSectors = SECTORS.length;
            const sectorAngle = 360 / numSectors;

            const sectorCenter = (sectorIndex + 0.5) * sectorAngle;
            const targetRotation = 3600 + (270 - sectorCenter);

            let audioInterval = setInterval(() => playClickSound(), 110);

            canvas.style.transform = `rotate(${targetRotation}deg)`;

            setTimeout(() => {
                clearInterval(audioInterval);
                finishSpin(prizeObj);
            }, 4600);
        }

        // Анимация Ленты
        function runRibbonAnimation(sectorIndex, prizeObj) {
            const track = document.getElementById('ribbonTrack');
            const cellPitch = 110;
            const containerCenter = 170;
            
            const targetCellIndex = (8 * SECTORS.length) + sectorIndex;
            const targetOffset = (targetCellIndex * cellPitch) + (100 / 2) - containerCenter;

            let audioInterval = setInterval(() => playClickSound(), 100);

            track.style.transform = `translateX(-${targetOffset}px)`;

            setTimeout(() => {
                clearInterval(audioInterval);
                finishSpin(prizeObj);
            }, 4600);
        }

        // Финиш вращения
        function finishSpin(prize) {
            isSpinning = false;

            if (prize.type === 'money') {
                sessionPrizes.money.push(prize.cashAmount);
            } else if (prize.type === 'item') {
                sessionPrizes.items.push(prize.name);
            } else if (prize.type === 'bonus') {
                attempts += 3;
                document.getElementById('attCounter').innerText = attempts;
            }

            displayModal(prize);
        }

        // Отображение Попапа
        function displayModal(prize) {
            const modal = document.getElementById('resultModal');
            const iconBox = document.getElementById('modalIconBox');
            const headline = document.getElementById('modalHeadline');
            const subtext = document.getElementById('modalSubtext');
            const btn = document.getElementById('modalBtn');
            const timerBox = document.getElementById('modalTimer');

            iconBox.innerHTML = SVGS[prize.svgKey];

            if (prize.type === 'money') {
                headline.innerText = "ВЫИГРЫШ!";
                subtext.innerHTML = `Вам выпал денежный приз:<br><strong style="color: #FFE259; font-size: 18px;">${prize.cashAmount} ₽</strong>`;
                confetti({ particleCount: 70, spread: 60 });
            } else if (prize.type === 'item') {
                headline.innerText = "ЦЕННЫЙ ПРИЗ!";
                subtext.innerHTML = `Вы выиграли:<br><strong style="color: #FFE259; font-size: 16px;">${prize.name}</strong>`;
                confetti({ particleCount: 90, spread: 70 });
            } else if (prize.type === 'bonus') {
                headline.innerText = "БОНУС!";
                subtext.innerHTML = `Вам начислено <strong>+3 дополнительные попытки!</strong>`;
            } else {
                headline.innerText = "НЕ ПОВЕЗЛО";
                subtext.innerText = "К сожалению, эта ячейка пустая. Попробуйте еще раз!";
            }

            if (attempts === 0) {
                // Запоминаем, что игрок полностью завершил все попытки
                localStorage.setItem('spun_done_' + userId, 'true');

                btn.innerText = "ЗАБРАТЬ ПРИЗЫ 🎁";
                let count = 5;
                timerBox.innerText = `Закроется автоматически через ${count}с...`;
                
                timerRef = setInterval(() => {
                    count--;
                    timerBox.innerText = `Закроется автоматически через ${count}с...`;
                    if (count <= 0) {
                        clearInterval(timerRef);
                        submitResults();
                    }
                }, 1000);
            } else {
                btn.innerText = "ПРОДОЛЖИТЬ";
                timerBox.innerText = "";
            }

            modal.classList.add('show');
        }

        function dismissModal() {
            const modal = document.getElementById('resultModal');
            modal.classList.remove('show');

            if (timerRef) clearInterval(timerRef);

            if (attempts === 0) {
                submitResults();
            } else {
                const canvas = document.getElementById('wheelCanvas');
                const track = document.getElementById('ribbonTrack');
                
                canvas.style.transition = 'none';
                canvas.style.transform = 'rotate(0deg)';
                track.style.transition = 'none';
                track.style.transform = 'translateX(0)';

                setTimeout(() => {
                    canvas.style.transition = 'transform 4.5s cubic-bezier(0.12, 0.8, 0.15, 1)';
                    track.style.transition = 'transform 4.5s cubic-bezier(0.12, 0.8, 0.15, 1)';
                    document.getElementById('spinBtn').disabled = false;
                }, 50);
            }
        }

        // Отправка данных в бота и закрытие Mini App
        function submitResults() {
            try {
                tg.sendData(JSON.stringify(sessionPrizes));
            } catch (err) {
                console.error("Ошибка при отправке в TG:", err);
            }
            setTimeout(() => {
                tg.close();
            }, 100);
        }
    </script>
</body>
</html>
