<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>КЭШ-МАГНАТ | VIP CLUB</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050713;
            --card-glass: rgba(18, 24, 48, 0.72);
            --gold-gradient: linear-gradient(135deg, #FFE259 0%, #FFA751 100%);
            --purple-gradient: linear-gradient(135deg, #8E2DE2 0%, #4A00E0 100%);
            --neon-gold: #FFE259;
            --neon-orange: #FFA751;
            --text-main: #FFFFFF;
            --text-muted: #94A3B8;
            --border-glass: rgba(255, 226, 89, 0.22);
            --border-subtle: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Премиальный анимированный Mesh-фон */
        .ambient-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: orbFloat 12s infinite alternate ease-in-out;
        }

        .orb-1 {
            width: 260px; height: 260px;
            background: #8E2DE2;
            top: -40px; left: -40px;
        }

        .orb-2 {
            width: 300px; height: 300px;
            background: #FFA751;
            bottom: -60px; right: -60px;
            animation-delay: -5s;
        }

        @keyframes orbFloat {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 40px) scale(1.1); }
        }

        .app-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 420px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px 24px 20px;
        }

        /* Шапка */
        .header-block {
            text-align: center;
            width: 100%;
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 226, 89, 0.06);
            border: 1px solid var(--border-glass);
            padding: 6px 16px;
            border-radius: 40px;
            backdrop-filter: blur(20px);
            margin-bottom: 8px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .brand-title {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-title svg {
            width: 22px; height: 22px;
            filter: drop-shadow(0 0 8px rgba(255, 226, 89, 0.6));
        }

        .attempts-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--card-glass);
            border: 1px solid var(--border-subtle);
            padding: 6px 18px;
            border-radius: 30px;
            backdrop-filter: blur(15px);
            margin-top: 4px;
        }

        .attempts-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .attempts-count {
            font-size: 15px;
            font-weight: 900;
            color: var(--neon-gold);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Игровая арена */
        .game-stage {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
        }

        /* КОЛЕСО ФОРТУНЫ */
        .wheel-wrapper {
            position: relative;
            width: 320px;
            height: 320px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .wheel-halo {
            position: absolute;
            width: 334px;
            height: 334px;
            border-radius: 50%;
            border: 3px solid var(--neon-gold);
            box-shadow: 0 0 35px rgba(255, 226, 89, 0.35), inset 0 0 20px rgba(255, 226, 89, 0.25);
            z-index: 3;
            pointer-events: none;
        }

        .pointer-marker {
            position: absolute;
            top: -14px;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 36px;
            z-index: 10;
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.8));
        }

        #wheelCanvas {
            width: 320px;
            height: 320px;
            border-radius: 50%;
            transition: transform 4.6s cubic-bezier(0.12, 0.8, 0.15, 1);
            will-change: transform;
        }

        /* ГОРИЗОНТАЛЬНАЯ ЛЕНТА */
        .ribbon-wrapper {
            display: none;
            position: relative;
            width: 100%;
            height: 136px;
            background: var(--card-glass);
            border: 2px solid var(--border-glass);
            border-radius: 24px;
            overflow: hidden;
            backdrop-filter: blur(20px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
        }

        .ribbon-pointer-line {
            position: absolute;
            top: 0; left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 100%;
            background: var(--gold-gradient);
            z-index: 10;
            box-shadow: 0 0 12px var(--neon-gold);
        }

        .ribbon-track {
            display: flex;
            align-items: center;
            height: 100%;
            position: absolute;
            left: 0;
            will-change: transform;
            transition: transform 4.6s cubic-bezier(0.12, 0.8, 0.15, 1);
        }

        .ribbon-card {
            width: 104px;
            height: 104px;
            margin: 0 6px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-subtle);
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px;
            gap: 6px;
            flex-shrink: 0;
        }

        .ribbon-card img, .ribbon-card svg {
            width: 36px;
            height: 36px;
            object-fit: contain;
        }

        .ribbon-card span {
            font-size: 10px;
            font-weight: 700;
            color: var(--text-main);
            text-align: center;
            line-height: 1.1;
        }

        /* Кнопка действия */
        .btn-glow {
            width: 100%;
            padding: 18px 0;
            border: none;
            border-radius: 50px;
            background: var(--gold-gradient);
            color: #050713;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 16px;
            font-weight: 900;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(255, 167, 81, 0.4);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            z-index: 5;
        }

        .btn-glow svg {
            width: 20px;
            height: 20px;
        }

        .btn-glow:active {
            transform: scale(0.96);
        }

        .btn-glow:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* МОДАЛЬНЫЕ ОКНА И ФИНАЛЬНЫЙ ЭКРАН */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(4, 6, 14, 0.92);
            backdrop-filter: blur(16px);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .modal-card {
            background: linear-gradient(160deg, #12182d 0%, #080a15 100%);
            border: 1px solid var(--border-glass);
            border-radius: 28px;
            padding: 30px 22px;
            width: 100%;
            max-width: 330px;
            text-align: center;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.9), 0 0 40px rgba(255, 226, 89, 0.15);
            transform: scale(0.85);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.active .modal-card {
            transform: scale(1);
        }

        .modal-icon-badge {
            width: 80px;
            height: 80px;
            margin: 0 auto 18px auto;
            background: rgba(255, 226, 89, 0.08);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 226, 89, 0.25);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .modal-icon-badge svg, .modal-icon-badge img {
            width: 42px;
            height: 42px;
            object-fit: contain;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 900;
            color: var(--neon-gold);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .modal-desc {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .prize-summary-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 12px 16px;
            margin-bottom: 18px;
        }

        .prize-summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .prize-summary-row:last-child {
            border-bottom: none;
        }

        .prize-label { color: var(--text-muted); }
        .prize-val { font-weight: 800; color: #FFFFFF; }

        .modal-action-btn {
            width: 100%;
            padding: 16px 0;
            border: none;
            border-radius: 50px;
            background: var(--gold-gradient);
            color: #050713;
            font-weight: 900;
            font-size: 15px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 8px 25px rgba(255, 167, 81, 0.3);
        }

        .security-note {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 14px;
        }
    </style>
</head>
<body>

    <div class="ambient-canvas">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <div class="app-container">
        <!-- Шапка -->
        <div class="header-block">
            <div class="brand-badge">
                <div class="brand-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                    КЭШ-МАГНАТ
                </div>
            </div>
            <br>
            <div class="attempts-pill">
                <span class="attempts-label">Доступно попыток:</span>
                <span class="attempts-count" id="attCounter">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
                    <span id="attNum">3</span>
                </span>
            </div>
        </div>

        <!-- Игровая Сцена -->
        <div class="game-stage">
            <!-- Колесо -->
            <div class="wheel-wrapper" id="wheelBox">
                <div class="wheel-halo"></div>
                <svg class="pointer-marker" viewBox="0 0 28 34" fill="none">
                    <path d="M14 34L0 0H28L14 34Z" fill="url(#ptrG)"/>
                    <defs>
                        <linearGradient id="ptrG" x1="14" y1="0" x2="14" y2="34" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#FFE259"/>
                            <stop offset="1" stop-color="#FFA751"/>
                        </linearGradient>
                    </defs>
                </svg>
                <canvas id="wheelCanvas" width="640" height="640"></canvas>
            </div>

            <!-- Лента -->
            <div class="ribbon-wrapper" id="ribbonBox">
                <div class="ribbon-pointer-line"></div>
                <div class="ribbon-track" id="ribbonTrack"></div>
            </div>
        </div>

        <!-- Кнопка Вращения -->
        <button class="btn-glow" id="spinBtn" onclick="executeSpin()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
            ИСПЫТАТЬ УДАЧУ
        </button>
    </div>

    <!-- Модалка Результата / Финальный Экран -->
    <div class="modal-overlay" id="resultModal">
        <div class="modal-card">
            <div class="modal-icon-badge" id="modalIconBox"></div>
            <h2 class="modal-title" id="modalTitle">ВЫИГРЫШ!</h2>
            <div id="modalBody"></div>
            <button class="modal-action-btn" id="modalBtn" onclick="handleModalAction()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                ПРОДОЛЖИТЬ
            </button>
            <div class="security-note">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                Результаты зашифрованы и сохранены
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const userId = tg.initDataUnsafe?.user?.id || 'guest_user';
        const urlParams = new URLSearchParams(window.location.search);
        
        // --- ФУНКЦИИ МУЛЬТИУРОВНЕВОГО СОХРАНЕНИЯ СОСТОЯНИЯ ---
        function saveState(stateObj) {
            const str = JSON.stringify(stateObj);
            try { localStorage.setItem('km_state_' + userId, str); } catch(e){}
            try { if (tg.CloudStorage) tg.CloudStorage.setItem('km_state_' + userId, str); } catch(e){}
        }

        function loadState() {
            try {
                const local = localStorage.getItem('km_state_' + userId);
                if (local) return JSON.parse(local);
            } catch(e){}
            return null;
        }

        function clearState() {
            try { localStorage.removeItem('km_state_' + userId); } catch(e){}
            try { if (tg.CloudStorage) tg.CloudStorage.removeItem('km_state_' + userId); } catch(e){}
        }

        // Если бот передал запрос на сброс админом
        if (urlParams.get('reset') === '1') {
            clearState();
        }

        const gameMode = urlParams.get('mode') === 'ribbon' ? 'ribbon' : 'wheel';

        // --- ВЕКТОРНЫЕ SVG ИКОНКИ ---
        const SVGS = {
            cross: `<svg viewBox="0 0 24 24" fill="none" stroke="#FF4B4B" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`,
            headphones: `<svg viewBox="0 0 24 24" fill="none" stroke="#FFE259" stroke-width="2" stroke-linecap="round"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg>`,
            bonus: `<svg viewBox="0 0 24 24" fill="none" stroke="#2ECC71" stroke-width="2" stroke-linecap="round"><path d="M20 12v10H4V12"/><path d="M22 7H2v5h20V7z"/><path d="M12 22V7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>`,
            cash: `<svg viewBox="0 0 24 24" fill="none" stroke="#2ECC71" stroke-width="2" stroke-linecap="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/><path d="M6 12h.01M18 12h.01"/></svg>`,
            iphone: `<svg viewBox="0 0 24 24" fill="none" stroke="#9B51E0" stroke-width="2" stroke-linecap="round"><rect x="5" y="2" width="14" height="20" rx="3"/><path d="M12 18h.01"/></svg>`,
            watch: `<svg viewBox="0 0 24 24" fill="none" stroke="#F2994A" stroke-width="2" stroke-linecap="round"><rect x="6" y="7" width="12" height="10" rx="3"/><path d="M9 3h6v4H9zM9 17h6v4H9z"/></svg>`,
            laptop: `<svg viewBox="0 0 24 24" fill="none" stroke="#2F80ED" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M2 20h20"/></svg>`,
            trophy: `<svg viewBox="0 0 24 24" fill="none" stroke="#FFE259" stroke-width="2" stroke-linecap="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2z"/></svg>`
        };

        const SECTORS = [
            { id: 0, type: 'loss', name: 'Проигрыш', svgKey: 'cross', color: '#13182E', img: '' },
            { id: 1, type: 'item', name: 'AirPods Pro 2', svgKey: 'headphones', color: '#1C1537', img: '' },
            { id: 2, type: 'bonus', name: '+3 Попытки', svgKey: 'bonus', color: '#0F2A1D', img: '' },
            { id: 3, type: 'money', name: 'Денежный приз', svgKey: 'cash', color: '#2A2115', img: '' },
            { id: 4, type: 'item', name: 'iPhone 15 Pro', svgKey: 'iphone', color: '#1C1537', img: '' },
            { id: 5, type: 'loss', name: 'Проигрыш', svgKey: 'cross', color: '#13182E', img: '' },
            { id: 6, type: 'item', name: 'Apple Watch', svgKey: 'watch', color: '#2A2115', img: '' },
            { id: 7, type: 'money', name: 'Денежный приз', svgKey: 'cash', color: '#2A2115', img: '' },
            { id: 8, type: 'item', name: 'MacBook Air', svgKey: 'laptop', color: '#102238', img: '' },
            { id: 9, type: 'loss', name: 'Проигрыш', svgKey: 'cross', color: '#13182E', img: '' }
        ];

        let attempts = 3;
        let spinStep = 0;
        let isSpinning = false;
        let sessionPrizes = { money: [], items: [] };

        window.addEventListener('DOMContentLoaded', () => {
            const isSpunURL = urlParams.get('spun') === '1';
            const saved = loadState();

            // Если бот отметил "отыграно" ИЛИ в сохраненном состоянии игра завершена
            if (isSpunURL || (saved && saved.isDone)) {
                if (saved && saved.sessionPrizes) sessionPrizes = saved.sessionPrizes;
                renderFinalSummaryModal(true);
                return;
            }

            // Восстановление неполного прогресса (например, осталась 1 или 2 попытки)
            if (saved && typeof saved.attempts === 'number') {
                attempts = saved.attempts;
                spinStep = saved.spinStep || 0;
                if (saved.sessionPrizes) sessionPrizes = saved.sessionPrizes;
            }

            document.getElementById('attNum').innerText = attempts;

            if (gameMode === 'ribbon') {
                document.getElementById('wheelBox').style.display = 'none';
                document.getElementById('ribbonBox').style.display = 'block';
                buildRibbonTrack();
            } else {
                renderWheel();
            }
        });

        function generateCashAmount() {
            const steps = Math.floor(Math.random() * 101);
            return 5000 + (steps * 100);
        }

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTickSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(840, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.035, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.04);
        }

        function renderWheel() {
            const canvas = document.getElementById('wheelCanvas');
            const ctx = canvas.getContext('2d');
            const num = SECTORS.length;
            const arc = (2 * Math.PI) / num;

            ctx.clearRect(0, 0, 640, 640);

            SECTORS.forEach((sec, i) => {
                const angle = i * arc;
                
                ctx.beginPath();
                ctx.fillStyle = sec.color;
                ctx.moveTo(320, 320);
                ctx.arc(320, 320, 310, angle, angle + arc);
                ctx.fill();

                ctx.lineWidth = 2;
                ctx.strokeStyle = 'rgba(255, 226, 89, 0.18)';
                ctx.stroke();

                ctx.save();
                ctx.translate(320, 320);
                ctx.rotate(angle + arc / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#FFFFFF";
                ctx.font = "700 20px 'Plus Jakarta Sans'";
                ctx.fillText(sec.name, 280, 7);
                ctx.restore();
            });
        }

        function buildRibbonTrack() {
            const track = document.getElementById('ribbonTrack');
            track.innerHTML = '';
            for (let r = 0; r < 12; r++) {
                SECTORS.forEach(sec => {
                    const cell = document.createElement('div');
                    cell.className = 'ribbon-card';
                    const iconContent = sec.img ? `<img src="${sec.img}">` : SVGS[sec.svgKey];
                    cell.innerHTML = `${iconContent}<span>${sec.name}</span>`;
                    track.appendChild(cell);
                });
            }
        }

        function executeSpin() {
            if (attempts <= 0 || isSpinning) return;

            isSpinning = true;
            spinStep++;
            attempts--;
            document.getElementById('attNum').innerText = attempts;
            document.getElementById('spinBtn').disabled = true;

            let targetSectorId = 0;
            let calculatedCash = 0;

            if (spinStep === 1) targetSectorId = 0;
            else if (spinStep === 2) targetSectorId = 1;
            else if (spinStep === 3) targetSectorId = 2;
            else if (spinStep === 4) targetSectorId = 5;
            else if (spinStep === 5) {
                targetSectorId = 3;
                calculatedCash = generateCashAmount();
            } else {
                targetSectorId = 9;
            }

            const targetSector = { ...SECTORS[targetSectorId] };
            if (calculatedCash > 0) targetSector.cashAmount = calculatedCash;

            if (gameMode === 'wheel') {
                runWheelAnimation(targetSectorId, targetSector);
            } else {
                runRibbonAnimation(targetSectorId, targetSector);
            }
        }

        function runWheelAnimation(sectorIndex, prizeObj) {
            const canvas = document.getElementById('wheelCanvas');
            const numSectors = SECTORS.length;
            const sectorAngle = 360 / numSectors;

            const sectorCenter = (sectorIndex + 0.5) * sectorAngle;
            const targetRotation = 3600 + (270 - sectorCenter);

            let audioInterval = setInterval(() => playTickSound(), 110);

            canvas.style.transform = `rotate(${targetRotation}deg)`;

            setTimeout(() => {
                clearInterval(audioInterval);
                finishSpin(prizeObj);
            }, 4600);
        }

        function runRibbonAnimation(sectorIndex, prizeObj) {
            const track = document.getElementById('ribbonTrack');
            const cellPitch = 116;
            const containerCenter = 170;
            
            const targetCellIndex = (8 * SECTORS.length) + sectorIndex;
            const targetOffset = (targetCellIndex * cellPitch) + (104 / 2) - containerCenter;

            let audioInterval = setInterval(() => playTickSound(), 100);

            track.style.transform = `translateX(-${targetOffset}px)`;

            setTimeout(() => {
                clearInterval(audioInterval);
                finishSpin(prizeObj);
            }, 4600);
        }

        function finishSpin(prize) {
            isSpinning = false;

            if (prize.type === 'money') {
                sessionPrizes.money.push(prize.cashAmount);
            } else if (prize.type === 'item') {
                sessionPrizes.items.push(prize.name);
            } else if (prize.type === 'bonus') {
                attempts += 3;
                document.getElementById('attNum').innerText = attempts;
            }

            // СОХРАНЕНИЕ ПРОГРЕССА ПОСЛЕ КАЖДОГО ВРАЩЕНИЯ
            saveState({
                attempts: attempts,
                spinStep: spinStep,
                sessionPrizes: sessionPrizes,
                isDone: attempts === 0
            });

            displayModal(prize);
        }

        function displayModal(prize) {
            const modal = document.getElementById('resultModal');
            const iconBox = document.getElementById('modalIconBox');
            const title = document.getElementById('modalTitle');
            const body = document.getElementById('modalBody');
            const btn = document.getElementById('modalBtn');

            iconBox.innerHTML = prize.img ? `<img src="${prize.img}">` : SVGS[prize.svgKey];

            if (prize.type === 'money') {
                title.innerText = "ВЫИГРЫШ!";
                body.innerHTML = `<div class="modal-desc">Вам выпал денежный приз:<br><strong style="color: #FFE259; font-size: 20px;">${prize.cashAmount} ₽</strong></div>`;
                confetti({ particleCount: 80, spread: 60, origin: { y: 0.6 } });
            } else if (prize.type === 'item') {
                title.innerText = "ЦЕННЫЙ ПРИЗ!";
                body.innerHTML = `<div class="modal-desc">Вы выиграли:<br><strong style="color: #FFE259; font-size: 18px;">${prize.name}</strong></div>`;
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            } else if (prize.type === 'bonus') {
                title.innerText = "БОНУС!";
                body.innerHTML = `<div class="modal-desc">Вам начислено <strong>+3 дополнительные попытки!</strong></div>`;
            } else {
                title.innerText = "НЕ ПОВЕЗЛО";
                body.innerHTML = `<div class="modal-desc">К сожалению, эта ячейка пустая. Попробуйте еще раз!</div>`;
            }

            if (attempts === 0) {
                btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg> ПОСМОТРЕТЬ ИТОГ`;
            } else {
                btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg> ПРОДОЛЖИТЬ`;
            }

            modal.classList.add('active');
        }

        function handleModalAction() {
            const modal = document.getElementById('resultModal');
            modal.classList.remove('active');

            if (attempts === 0) {
                renderFinalSummaryModal(false);
            } else {
                const canvas = document.getElementById('wheelCanvas');
                const track = document.getElementById('ribbonTrack');
                
                canvas.style.transition = 'none';
                canvas.style.transform = 'rotate(0deg)';
                track.style.transition = 'none';
                track.style.transform = 'translateX(0)';

                setTimeout(() => {
                    canvas.style.transition = 'transform 4.6s cubic-bezier(0.12, 0.8, 0.15, 1)';
                    track.style.transition = 'transform 4.6s cubic-bezier(0.12, 0.8, 0.15, 1)';
                    document.getElementById('spinBtn').disabled = false;
                }, 50);
            }
        }

        // БЛОКИРУЮЩИЙ ФИНАЛЬНЫЙ ЭКРАН (БЕЗ ВОЗМОЖНОСТИ КРУТИТЬ СНОВА)
        function renderFinalSummaryModal(isAlreadyDone) {
            document.getElementById('attNum').innerText = "0";
            document.getElementById('spinBtn').disabled = true;

            const modal = document.getElementById('resultModal');
            const iconBox = document.getElementById('modalIconBox');
            const title = document.getElementById('modalTitle');
            const body = document.getElementById('modalBody');
            const btn = document.getElementById('modalBtn');

            iconBox.innerHTML = SVGS.trophy;
            title.innerText = "ВЫИГРЫШ ЗАФИКСИРОВАН!";

            const totalMoney = sessionPrizes.money.reduce((a, b) => a + b, 0);
            const itemsList = sessionPrizes.items.length > 0 ? sessionPrizes.items.join(', ') : 'Не выпадали';

            body.innerHTML = `
                <div class="modal-desc">Все попытки использованы! Ваши награды зарезервированы:</div>
                <div class="prize-summary-box">
                    <div class="prize-summary-row">
                        <span class="prize-label">Баланс к выплате:</span>
                        <span class="prize-val" style="color: #2ECC71;">${totalMoney > 0 ? totalMoney + ' ₽' : 'Зафиксирован'}</span>
                    </div>
                    <div class="prize-summary-row">
                        <span class="prize-label">Физические призы:</span>
                        <span class="prize-val" style="color: #FFE259;">${itemsList}</span>
                    </div>
                </div>
                <div style="font-size: 12px; color: #94A3B8; margin-bottom: 18px; line-height: 1.4;">
                    Перейдите в Telegram-бота и выполните 2 простых шага для подтверждения личности и получения призов!
                </div>
            `;

            btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg> ЗАБРАТЬ В БОТЕ`;
            
            btn.onclick = () => {
                try {
                    tg.sendData(JSON.stringify(isAlreadyDone ? { alreadySpun: true } : sessionPrizes));
                } catch(e){}
                setTimeout(() => tg.close(), 100);
            };

            modal.classList.add('active');
        }
    </script>
</body>
</html>
