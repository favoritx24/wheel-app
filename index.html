<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fortune Premium</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --gold: linear-gradient(45deg, #ffd700, #ffae00);
            --dark: #0f0f0f;
        }
        body {
            background: var(--dark);
            color: white;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .wheel-container {
            position: relative;
            width: 320px;
            height: 320px;
            border: 8px solid #222;
            border-radius: 50%;
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.2);
        }
        #wheel {
            width: 100%;
            height: 100%;
            transition: transform 5s cubic-bezier(0.2, 0, 0, 1);
        }
        .pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            z-index: 10;
        }
        .win-popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(20, 20, 20, 0.95);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid gold;
            text-align: center;
            z-index: 100;
            width: 80%;
        }
        .btn-spin {
            margin-top: 30px;
            padding: 15px 40px;
            background: var(--gold);
            border: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-spin:active { transform: scale(0.9); }
    </style>
</head>
<body>
    <h1 style="margin-bottom: 5px;">LUCKY WHEEL</h1>
    <p id="attempts">Осталось попыток: 3</p>

    <div class="wheel-container">
        <img src="https://cdn-icons-png.flaticon.com/512/8644/8644020.png" class="pointer">
        <canvas id="wheel"></canvas>
    </div>

    <button class="btn-spin" onclick="spin()">КРУТИТЬ</button>

    <div id="winPopup" class="win-popup">
        <h2 style="color: gold">ВЫ ВЫИГРАЛИ!</h2>
        <h1 id="prizeName">iPhone 15 Pro</h1>
        <p id="timer">Закроется через 5 сек...</p>
        <button class="btn-spin" onclick="closeApp()">ЗАБРАТЬ ПРИЗ</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        let attempts = 3;
        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        const prizes = ["iPhone 15", "5000₽", "AirPods", "3000₽", "MacBook", "7000₽"];
        
        // Рисование колеса (упрощенно)
        function drawWheel() {
            const size = 300;
            canvas.width = size;
            canvas.height = size;
            for(let i=0; i<prizes.length; i++) {
                ctx.beginPath();
                ctx.fillStyle = i % 2 === 0 ? "#1a1a1a" : "#2a2a2a";
                ctx.moveTo(150, 150);
                ctx.arc(150, 150, 150, i * 2 * Math.PI / prizes.length, (i+1) * 2 * Math.PI / prizes.length);
                ctx.fill();
                ctx.fillStyle = "white";
                ctx.fillText(prizes[i], 180, 150);
            }
        }
        drawWheel();

        function spin() {
            if(attempts <= 0) return;
            attempts--;
            document.getElementById('attempts').innerText = `Осталось попыток: ${attempts}`;
            
            const rotation = Math.floor(3000 + Math.random() * 3000);
            canvas.style.transform = `rotate(${rotation}deg)`;
            
            setTimeout(() => {
                showWin(prizes[Math.floor(Math.random()*prizes.length)]);
            }, 5000);
        }

        function showWin(prize) {
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
            document.getElementById('prizeName').innerText = prize;
            document.getElementById('winPopup').style.display = 'block';
            
            let sec = 5;
            const interval = setInterval(() => {
                sec--;
                document.getElementById('timer').innerText = `Закроется через ${sec} сек...`;
                if(sec <= 0) closeApp();
            }, 1000);
        }

        function closeApp() {
            const prize = document.getElementById('prizeName').innerText;
            const data = {
                type: prize.includes('₽') ? 'money' : 'item',
                value: prize.replace('₽', '')
            };
            tg.sendData(JSON.stringify(data));
        }
    </script>
</body>
</html>
