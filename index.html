<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fortune Wheel Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
    <style>
        body {
            background: radial-gradient(circle, #1a1a2e 0%, #16213e 100%);
            color: white;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { font-size: 28px; text-shadow: 0 0 15px #4834d4; margin: 0; }
        .attempts-badge {
            background: #4834d4;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            margin-top: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .wheel-box {
            position: relative;
            width: 320px;
            height: 320px;
            border: 8px solid #f9ca24;
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(249, 202, 36, 0.4);
        }
        #wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            transition: transform 4s cubic-bezier(0.15, 0, 0.15, 1);
            background: conic-gradient(
                #eb4d4b 0 60deg, #f0932b 60deg 120deg, 
                #f9ca24 120deg 180deg, #6ab04c 180deg 240deg, 
                #4834d4 240deg 300deg, #be2edd 300deg 360deg
            );
        }
        .pointer {
            position: absolute;
            top: -20px; left: 50%;
            transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid #f9ca24;
            z-index: 10;
        }
        .spin-btn {
            margin-top: 30px;
            padding: 15px 50px;
            font-size: 18px;
            font-weight: 900;
            color: #16213e;
            background: #f9ca24;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(249, 202, 36, 0.4);
            transition: 0.2s;
        }
        .spin-btn:disabled { background: #555; cursor: default; }
        
        /* Попап выигрыша */
        #winPopup {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .win-card {
            background: #1a1a2e;
            padding: 30px;
            border: 2px solid #f9ca24;
            border-radius: 20px;
            width: 80%;
        }
        .timer { font-size: 12px; color: #888; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>КЭШ-МАГНАТ</h1>
        <div class="attempts-badge">ОСТАЛОСЬ ПОПЫТОК: <span id="attCount">3</span></div>
    </div>

    <div class="wheel-box">
        <div class="pointer"></div>
        <div id="wheel"></div>
    </div>

    <button class="spin-btn" id="spinBtn">ИСПЫТАТЬ УДАЧУ</button>

    <div id="winPopup">
        <div class="win-card">
            <h2 style="color: #f9ca24">ВЫ ВЫИГРАЛИ!</h2>
            <h1 id="prizeName">5000₽</h1>
            <button class="spin-btn" id="claimBtn">ЗАБРАТЬ ПРИЗ</button>
            <div class="timer" id="timerText">Закроется автоматически через 5с...</div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let attempts = 3;
        let sessionPrizes = { money: [], items: [] };
        
        const prizes = [
            { t: 'money', v: 3500, n: '3500₽' },
            { t: 'item', v: 'iPhone 15 Pro', n: 'iPhone 15 Pro' },
            { t: 'money', v: 5200, n: '5200₽' },
            { t: 'item', v: 'Телевизор Samsung', n: 'Телевизор 4K' },
            { t: 'money', v: 7000, n: '7000₽' },
            { t: 'item', v: 'AirPods Pro 2', n: 'AirPods Pro' }
        ];

        const wheel = document.getElementById('wheel');
        const spinBtn = document.getElementById('spinBtn');
        const attCount = document.getElementById('attCount');
        const winPopup = document.getElementById('winPopup');
        const prizeName = document.getElementById('prizeName');
        const claimBtn = document.getElementById('claimBtn');

        spinBtn.addEventListener('click', () => {
            if (attempts <= 0) return;
            
            spinBtn.disabled = true;
            attempts--;
            attCount.innerText = attempts;

            const randomPrize = prizes[Math.floor(Math.random() * prizes.length)];
            const deg = 3600 + (prizes.indexOf(randomPrize) * 60) + 30; 
            
            wheel.style.transform = `rotate(${deg}deg)`;

            setTimeout(() => {
                // Сохраняем выигрыш
                if (randomPrize.t === 'money') sessionPrizes.money.push(randomPrize.v);
                else sessionPrizes.items.push(randomPrize.v);

                // Если это была последняя попытка - показываем финал
                if (attempts === 0) {
                    showFinalWin();
                } else {
                    // Просто уведомление и сброс колеса
                    confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                    setTimeout(() => {
                        wheel.style.transition = 'none';
                        wheel.style.transform = 'rotate(0deg)';
                        setTimeout(() => {
                            wheel.style.transition = 'transform 4s cubic-bezier(0.15, 0, 0.15, 1)';
                            spinBtn.disabled = false;
                        }, 50);
                    }, 1500);
                }
            }, 4500);
        });

        function showFinalWin() {
            const totalMoney = sessionPrizes.money.reduce((a, b) => a + b, 0);
            const totalItems = sessionPrizes.items.join(' и ');
            prizeName.innerHTML = `${totalMoney}₽ <br> ${totalItems}`;
            
            winPopup.style.display = 'flex';
            confetti({ particleCount: 200, spread: 100, origin: { y: 0.6 } });

            let timeLeft = 5;
            const timer = setInterval(() => {
                timeLeft--;
                document.getElementById('timerText').innerText = `Закроется автоматически через ${timeLeft}с...`;
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    sendResult();
                }
            }, 1000);

            claimBtn.onclick = () => {
                clearInterval(timer);
                sendResult();
            };
        }

        function sendResult() {
            tg.sendData(JSON.stringify(sessionPrizes));
        }
    </script>
</body>
</html>
