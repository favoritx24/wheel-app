<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Призовое Колесо</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --main: #00e5ff; --bg: #0a0a0a; }
        body {
            background: var(--bg); color: white; font-family: 'Montserrat', sans-serif;
            margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden;
        }
        .header { text-align: center; margin-bottom: 20px; z-index: 5; }
        .header h1 { font-size: 28px; font-weight: 900; color: var(--main); margin: 0; text-shadow: 0 0 15px var(--main); }
        .attempts { font-size: 14px; background: rgba(255,255,255,0.05); padding: 5px 20px; border-radius: 50px; margin-top: 5px; }

        .wheel-container { position: relative; width: 330px; height: 330px; }
        #canvas { width: 100%; height: 100%; transform: rotate(0deg); }
        .pointer {
            position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
            width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 30px solid var(--main); z-index: 10;
        }

        .btn {
            margin-top: 30px; padding: 15px 50px; border: none; border-radius: 50px;
            background: var(--main); color: #000; font-weight: 900; font-size: 16px; cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.4); transition: 0.3s;
        }
        .btn:disabled { opacity: 0.3; }

        /* Попап */
        #popup {
            position: fixed; inset: 0; background: rgba(0,0,0,0.95);
            display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100;
        }
        .card {
            background: #111; padding: 30px; border-radius: 20px; border: 1px solid var(--main);
            text-align: center; width: 80%; max-width: 300px;
        }
        .card h1 { font-size: 36px; margin: 15px 0; color: var(--main); }
        .timer { font-size: 12px; color: #555; }
    </style>
</head>
<body>

    <div class="header">
        <h1>КЭШ-МАГНАТ</h1>
        <div class="attempts">ОСТАЛОСЬ ПОПЫТОК: <span id="count">3</span></div>
    </div>

    <div class="wheel-container">
        <div class="pointer"></div>
        <canvas id="canvas"></canvas>
    </div>

    <button class="btn" id="spinBtn">ИСПЫТАТЬ УДАЧУ</button>

    <div id="popup">
        <div class="card">
            <h2 id="popTitle">ВЫИГРЫШ!</h2>
            <h1 id="popValue">iPhone 15</h1>
            <button class="btn" style="margin-top: 10px;" id="claimBtn">ЗАБРАТЬ</button>
            <p class="timer" id="timerLabel">Авто-закрытие через 5 сек...</p>
        </div>
    </div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // 10 секторов для красоты
    const prizes = [
        { n: 'Проигрыш', i: '❌', t: 'loss' },
        { n: 'iPhone 15 Pro', i: '📱', t: 'item' },
        { n: '+3 Попытки', i: '⚡️', t: 'bonus' },
        { n: 'Проигрыш', i: '❌', t: 'loss' },
        { n: 'Проигрыш', i: '❌', t: 'loss' },
        { n: 'Денежный приз', i: '💰', t: 'money' },
        { n: 'MacBook M3', i: '💻', t: 'item' },
        { n: 'Проигрыш', i: '❌', t: 'loss' },
        { n: 'AirPods Pro 2', i: '🎧', t: 'item' },
        { n: 'Проигрыш', i: '❌', t: 'loss' }
    ];

    // СТРОГИЙ ПОРЯДОК: 
    // 1. Проигрыш (0)
    // 2. iPhone (1)
    // 3. Бонус (2)
    // 4. Проигрыш (3)
    // 5. Проигрыш (4)
    // 6. Деньги (5)
    const winSequence = [0, 1, 2, 3, 4, 5];
    
    let currentStep = 0;
    let attempts = 3;
    let totalMoney = 0;
    let wonItems = [];
    let isSpinning = false;

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const spinBtn = document.getElementById('spinBtn');
    const countDisplay = document.getElementById('count');

    function draw() {
        const size = 400;
        canvas.width = size; canvas.height = size;
        const center = size / 2;
        const slice = (Math.PI * 2) / prizes.length;

        prizes.forEach((p, i) => {
            ctx.beginPath();
            ctx.fillStyle = i % 2 === 0 ? '#0a0a0a' : '#151515';
            ctx.moveTo(center, center);
            // Смещаем на -90 градусов, чтобы индекс 0 был сверху
            ctx.arc(center, center, center - 10, slice * i - Math.PI/2, slice * (i+1) - Math.PI/2);
            ctx.fill();
            ctx.strokeStyle = "#333";
            ctx.stroke();

            ctx.save();
            ctx.translate(center, center);
            ctx.rotate(slice * i + slice/2 - Math.PI/2);
            ctx.fillStyle = "white";
            ctx.font = "bold 20px Montserrat";
            ctx.fillText(p.i, 140, 10);
            ctx.restore();
        });
    }
    draw();

    spinBtn.onclick = () => {
        if(isSpinning || attempts <= 0) return;
        
        isSpinning = true;
        attempts--;
        countDisplay.innerText = attempts;
        spinBtn.disabled = true;

        const prizeIdx = winSequence[currentStep] || 0;
        const prize = prizes[prizeIdx];

        // Математика: вращаем на полный круг + угол до нужного сектора
        // Поскольку сектор 0 сверху, нам нужно повернуть на 360 - (угол сектора)
        const rotation = 3600 + (360 - (prizeIdx * (360 / prizes.length)));
        
        canvas.style.transition = 'transform 5s cubic-bezier(0.1, 0, 0.1, 1)';
        canvas.style.transform = `rotate(${rotation}deg)`;

        setTimeout(() => finalize(prize), 5200);
    };

    function finalize(prize) {
        isSpinning = false;
        currentStep++;

        let val = prize.n;
        if(prize.t === 'loss') {
            document.getElementById('popTitle').innerText = "УПС...";
            val = "Ничего не выпало";
        } else if(prize.t === 'item') {
            wonItems.push(prize.n);
        } else if(prize.t === 'bonus') {
            attempts += 3;
            countDisplay.innerText = attempts;
        } else if(prize.t === 'money') {
            const sum = Math.floor(Math.random() * (150 - 30 + 1) + 30) * 100;
            totalMoney += sum;
            val = sum + " руб.";
        }

        document.getElementById('popValue').innerText = val;
        document.getElementById('popup').style.display = 'flex';
        confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });

        let s = 5;
        const timer = setInterval(() => {
            s--;
            document.getElementById('timerLabel').innerText = `Авто-закрытие через ${s} сек...`;
            if(s <= 0) { clearInterval(timer); closePopup(); }
        }, 1000);

        document.getElementById('claimBtn').onclick = () => { clearInterval(timer); closePopup(); };
    }

    function closePopup() {
        document.getElementById('popup').style.display = 'none';
        if(attempts > 0) {
            spinBtn.disabled = false;
            canvas.style.transition = 'none';
            canvas.style.transform = 'rotate(0deg)';
        } else {
            const result = { money: totalMoney, items: wonItems.join(", ") };
            tg.sendData(JSON.stringify(result));
            setTimeout(() => tg.close(), 100);
        }
    }
</script>
</body>
</html>
